                var from = endPt(fromP, toP);
                var to = endPt(toP, fromP);
                var kc = KIND_COLORS[conn.kind] || KIND_COLORS.audio;
                var distX = to.x - from.x;
                var distY = to.y - from.y;
                var path;
                var labelPos = null;
                // "Hacia atras": los extremos se miran de espaldas (ej. salida derecha → entrada izquierda de un nodo debajo).
                // Se rodea por fuera y se cruza por el hueco entre nodos, en un carril propio para no encimar cables.
                var facing = from.nx === -to.nx;
                var gap = (to.x - from.x) * from.nx;
                var backward = facing && gap < 60 && cableStyle !== "straight";
                if (backward) {
                  var sd = devById[conn.from.device], td = devById[conn.to.device];
                  var sTop = sd.y, sBot = sd.y + nodeHeight(sd, filter);
                  var tTop = td.y, tBot = td.y + nodeHeight(td, filter);
                  var seed = idSeed(conn.id);
                  var laneY;
                  if (tTop - sBot > 20) laneY = (sBot + tTop) / 2;
                  else if (sTop - tBot > 20) laneY = (tBot + sTop) / 2;
                  else laneY = Math.max(sBot, tBot) + 30;
                  laneY += ((seed >> 4) % 5 - 2) * 6;
                  var x1 = from.x + from.nx * (26 + (seed % 4) * 7);
                  var x2 = to.x + to.nx * (26 + ((seed >> 2) % 4) * 7);
                  path = roundedPath([[from.x, from.y], [x1, from.y], [x1, laneY], [x2, laneY], [x2, to.y], [to.x, to.y]],
                    cableStyle === "ortho" ? 12 : 26);
                  labelPos = { x: (x1 + x2) / 2, y: laneY };
                } else if (cableStyle === "ortho" && !(from.nx === 1 && to.nx === -1)) {
                  // Ortogonal con extremos no estandar (puertos I/O o cable iniciado en una entrada)
                  var ox1 = from.x + from.nx * 30, ox2 = to.x + to.nx * 30;
                  var omy = (from.y + to.y) / 2;
                  path = roundedPath([[from.x, from.y], [ox1, from.y], [ox1, omy], [ox2, omy], [ox2, to.y], [to.x, to.y]], 12);
                } else if (cableStyle === "ortho") {
                  // Orthogonal: horizontal → vertical → horizontal with rounded corners
                  var midX = from.x + distX * 0.5;
                  var r = Math.min(18, Math.abs(distX) * 0.25, Math.abs(distY) * 0.25);
                  if (Math.abs(distY) < 4) {
                    // Same height - just a horizontal line
                    path = "M" + from.x + "," + from.y + " L" + to.x + "," + to.y;
                  } else if (distX >= 60) {
                    // Target to the right - simple elbow
                    var sy = distY > 0 ? r : -r;
                    path = "M" + from.x + "," + from.y +
                      " L" + (midX - r) + "," + from.y +
                      " Q" + midX + "," + from.y + " " + midX + "," + (from.y + sy) +
                      " L" + midX + "," + (to.y - sy) +
                      " Q" + midX + "," + to.y + " " + (midX + r) + "," + to.y +
                      " L" + to.x + "," + to.y;
                  } else {
                    // Target to left or close - go out then back
                    var outX = from.x + 60;
                    var inX = to.x - 60;
                    var midY = from.y + distY * 0.5;
                    var sy2 = distY > 0 ? r : -r;
                    path = "M" + from.x + "," + from.y +
                      " L" + (outX - r) + "," + from.y +
                      " Q" + outX + "," + from.y + " " + outX + "," + (from.y + sy2) +
                      " L" + outX + "," + (midY - sy2) +
                      " Q" + outX + "," + midY + " " + (outX - r) + "," + midY +
                      " L" + (inX + r) + "," + midY +
                      " Q" + inX + "," + midY + " " + inX + "," + (midY + sy2) +
                      " L" + inX + "," + (to.y - sy2) +
                      " Q" + inX + "," + to.y + " " + (inX + r) + "," + to.y +
                      " L" + to.x + "," + to.y;
                  }
                } else if (cableStyle === "straight") {
                  path = "M" + from.x + "," + from.y + " L" + to.x + "," + to.y;
                } else {
                  // Bezier: los puntos de control salen en la direccion de cada puerto
                  var dist2 = Math.sqrt(distX * distX + distY * distY);
                  var bend = Math.max(60, Math.min(400, Math.abs(distX) * 0.5, dist2 * 0.5));
                  path = "M" + from.x + "," + from.y +
                    " C" + (from.x + from.nx * bend) + "," + from.y + " " + (to.x + to.nx * bend) + "," + to.y +
                    " " + to.x + "," + to.y;
                }
                var isSel = selectedConn === conn.id;
                var isMSel = multiSelectConn.indexOf(conn.id) >= 0;
                var midX = labelPos ? labelPos.x : (from.x + to.x) / 2;
                var midY = labelPos ? labelPos.y + 14 : (from.y + to.y) / 2;
                var dashed = conn.mode === "jam" ? "6,4" : conn.mode === "daw" ? "2,4" : "none";
                var isFocused = focusedPort && (
                  (conn.from.device === focusedPort.devId && conn.from.port === focusedPort.portId) ||
                  (conn.to.device === focusedPort.devId && conn.to.port === focusedPort.portId)
                );
                // La senal va de la salida a la entrada; si el cable se creo desde una entrada, va al reves
                var reversed = from.dir === "in" || to.dir === "out";
                var srcDevId = reversed ? conn.to.device : conn.from.device;
                var touchesFlow = flowDev && (conn.from.device === flowDev || conn.to.device === flowDev);
                var flowRole = touchesFlow ? (srcDevId === flowDev ? "out" : "in") : null;
                if (flowRole) flowCount[flowRole]++;
                var isDimmed = (focusedPort && !isFocused && !isSel && !isMSel) || (flowDev && !touchesFlow && !isSel && !isMSel);
                var baseW = conn.strokeW || globalCableW;
                var baseOp = conn.opacity !== undefined ? conn.opacity : globalCableOp;
                var isHov = hoveredConn === conn.id;
                var strokeColor = isMSel ? "var(--teal-ink)" : isFocused ? "rgb(var(--fg))" : isHov ? "rgb(var(--fg))" :
                  flowRole ? "var(--flow-" + flowRole + ")" : kc.line;
                var strokeW = isMSel ? Math.max(4, baseW) : isFocused ? Math.max(4, baseW) : isSel ? Math.max(3.5, baseW) : isHov ? Math.max(3, baseW) :
                  flowRole ? Math.max(3, baseW) : baseW;
                var strokeOp = isDimmed ? 0.07 : (isMSel || isFocused || isSel || isHov || flowRole ? 1 : baseOp);
                var arrowId = isMSel ? "arr-sel" : (isFocused || isHov) ? "arr-fg" : flowRole ? "arr-" + flowRole : "arr-" + (KIND_COLORS[conn.kind] ? conn.kind : "audio");
                return (
                  <g key={conn.id} style={{ cursor: "pointer" }}
                    onContextMenu={function(e) { openCtx(e, "conn", conn.id); }}
                    onMouseEnter={function() { setHoveredConn(conn.id); }}
                    onMouseLeave={function() { setHoveredConn(null); }}
                    onClick={function(e) {
                      e.stopPropagation();
                      var cid = conn.id;
                      if (e.ctrlKey || e.metaKey) {
                        setMultiSelectConn(function(msc) {
                          if (msc.indexOf(cid) >= 0) return msc.filter(function(id) { return id !== cid; });
                          return msc.concat([cid]);
                        });
                        setSelectedConn(null);
                      } else {
                        setSelectedConn(cid);
                        setMultiSelectConn([]);
                      }
                    }}>
                    <path d={path} fill="none" stroke={strokeColor} strokeWidth={strokeW}
                      strokeDasharray={dashed} opacity={strokeOp}
                      markerEnd={reversed ? undefined : "url(#" + arrowId + ")"}
                      markerStart={reversed ? "url(#" + arrowId + ")" : undefined}
                      filter={isMSel || isFocused || isSel || isHov ? "url(#glow-" + (conn.kind || "audio") + ")" : undefined}
                      style={{ transition: "stroke-opacity 0.15s, stroke-width 0.15s" }} />
                    {conn.kind === "adat" ? (
                      <path d={path} fill="none" stroke="var(--bg)" strokeWidth={Math.max(1, strokeW * 0.4)}
                        strokeOpacity={isDimmed ? 0.05 : 0.9} strokeDasharray={dashed} style={{ pointerEvents: "none" }} />
                    ) : null}
                    <path d={path} fill="none" stroke="transparent" strokeWidth={18} />
                    {(function() {
                      var parts = [];
                      if (conn.kind === "midi") {
                        if (conn.mpe) {
                          parts.push("MPE " + (conn.mpeZone === "upper" ? "↑" : "↓"));
                        } else {
                          var co = conn.midiChannelOut;
                          var ci = conn.midiChannelIn;
                          var coStr = co === "omni" ? "Omni" : (co != null ? "Ch " + co : null);
                          var ciStr = ci === "omni" ? "Omni" : (ci != null ? String(ci) : null);
                          if (coStr && ciStr && String(co) !== String(ci)) parts.push(coStr + "→" + ciStr);
                          else if (coStr) parts.push(coStr);
                          else if (ciStr) parts.push("Ch " + ciStr);
                        }
                      }
                      if (conn.kind === "adat") {
                        if (conn.adatMode) parts.push(conn.adatMode === "smux" ? "S/MUX 4ch" : "8ch");
                        if (conn.adatClock) parts.push(conn.adatClock === "from" ? "⏱→" : "→⏱");
                      }
                      if (conn.label) parts.push(conn.label);
                      var txt = parts.join(" · ");
                      if (!txt) return null;
                      return (
                        <g transform={"translate(" + midX + "," + (midY - 14) + ")"} style={{ pointerEvents: "none" }}>
                          <rect x={-txt.length * 3.5 - 6} y={-9} width={txt.length * 7 + 12} height={18} rx={3}
                            fill="rgba(var(--panel),0.7)" stroke={kc.line} strokeWidth={0.5} />
                          <text textAnchor="middle" dy={4} fill={kindInk(conn.kind)} fontSize={10} fontFamily="inherit">{txt}</text>
                        </g>
                      );
                    })()}
                  </g>
                );
              })}

              {/* Connecting preview */}
              {connecting && portPos[connecting.devId + "|" + connecting.portId] ? (
                <line
                  x1={portPos[connecting.devId + "|" + connecting.portId].x}
                  y1={portPos[connecting.devId + "|" + connecting.portId].y}

              ) : null}

              {/* Sticky Notes */}
              {stickyNotes.map(function(note) {
                var isSel = selectedNote === note.id;
                var nw = note.w || 200;
                // En claro: papel solido con borde/titulo oscurecidos; en oscuro: tinte translucido

                var nFill = light ? note.color + "e6" : note.color + "22";
                var nHead = light ? darkenHex(note.color, 0.12) : note.color + "33";

                var nInk = light ? darkenHex(note.color, 0.62) : note.color;

                  <g key={note.id}

                      var w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);

                      histBreak();

                    <text x={note.x + 8} y={note.y + 15} fill={nInk} fontSize={10} fontWeight={700} fontFamily="inherit">Nota</text>
                    {isSel ? (
                      <g onClick={function(e) { e.stopPropagation(); deleteStickyNote(note.id); }} style={{ cursor: "pointer" }}>
                        <circle cx={note.x + nw - 12} cy={note.y + 12} r={8} fill="rgba(255,0,0,0.2)" stroke="rgba(255,80,80,0.5)" strokeWidth={1} />
                        <text x={note.x + nw - 12} y={note.y + 16} textAnchor="middle" fill="var(--danger-ink)" fontSize={11}>x</text>
                      </g>

                    <foreignObject x={note.x + 6} y={note.y + 26} width={nw - 12} height={48}>
                      <div xmlns="http://www.w3.org/1999/xhtml" key={note.text}
                        contentEditable suppressContentEditableWarning
                        onBlur={function(e) {
                          var nid = note.id;
                          var txt = e.target.innerText;
                          if (txt === note.text) return;
                          histBreak();
                          setStickyNotes(function(ns) {
                            return ns.map(function(n) {
                              return n.id === nid ? Object.assign({}, n, { text: txt }) : n;
                            });
                          });
                        }}
                        onPointerDown={function(e) { e.stopPropagation(); }}
                        style={{ color: light ? "rgba(40,32,10,0.9)" : "rgba(var(--fg),0.7)", fontSize: 10, fontFamily: "inherit",
                          lineHeight: 1.4, outline: "none", width: "100%", height: "100%",
                          overflow: "hidden", cursor: "text", wordBreak: "break-word" }}>
                        {note.text}
                      </div>
                    </foreignObject>
                  </g>
                );
              })}

              {/* Device Nodes */}
              {devices.filter(isDevVisible).map(function(dev) {
                var h = nodeHeight(dev, filter);
                var devInk = theme === "light" ? darkenHex(dev.color, 0.35) : dev.color;
                var isSel = selected === dev.id;
                var isMSel = multiSelect.indexOf(dev.id) >= 0;
                var vPorts = visiblePorts(dev, filter);
                var rows = portRows(vPorts);
                var iIn = 0, iOut = 0, iBoth = 0;
                var portEls = vPorts.map(function(port) {
                  var row = port.dir === "both" ? rows.io + iBoth++ : port.dir === "out" ? iOut++ : iIn++;

                });
                return (
                  <g key={dev.id} onPointerDown={function(e) { startDrag(dev, e); }}
                    onContextMenu={function(e) { openCtx(e, "dev", dev.id); }}>
                    <rect x={dev.x + 4} y={dev.y + 4} width={NODE_W} height={h} rx={8} fill="rgba(var(--shade),calc(0.4 * var(--shade-k)))" />

                    <text x={dev.x + 32} y={dev.y + 32} fill="rgba(var(--fg),0.5)" fontSize={9} fontFamily="inherit">{dev.type}</text>
                    {dev.pages && dev.pages.length > 1 ? (function() {
                      var cur = curModPage(dev);
                      var idx = dev.pages.findIndex(function(pg) { return pg.id === cur; });
                      var pg = dev.pages[idx];
                      var label = (pg.name.length > 14 ? pg.name.slice(0, 13) + "…" : pg.name) + " " + (idx + 1) + "/" + dev.pages.length;
                      var stop = function(e) { e.stopPropagation(); };
                      return (
                        <g onPointerDown={stop}>
                          <rect x={dev.x + NODE_W - 150} y={dev.y + 23} width={142} height={14} rx={3} fill="rgba(var(--fg),0.06)" />
                          <g style={{ cursor: "pointer" }} onClick={function(e) { e.stopPropagation(); gotoModPage(dev.id, -1); }}>
                            <rect x={dev.x + NODE_W - 150} y={dev.y + 23} width={16} height={14} fill="transparent" />
                            <text x={dev.x + NODE_W - 142} y={dev.y + 33} textAnchor="middle" fill="var(--teal-ink)" fontSize={10}>‹</text>
                          </g>
                          <text x={dev.x + NODE_W - 79} y={dev.y + 33} textAnchor="middle" fill="rgba(var(--fg),0.75)" fontSize={8}
                            fontFamily="inherit" style={{ cursor: "pointer" }}
                            onDoubleClick={function(e) { e.stopPropagation(); renameModPage(dev.id); }}>{label}</text>
                          <g style={{ cursor: "pointer" }} onClick={function(e) { e.stopPropagation(); gotoModPage(dev.id, 1); }}>
                            <rect x={dev.x + NODE_W - 24} y={dev.y + 23} width={16} height={14} fill="transparent" />
                            <text x={dev.x + NODE_W - 16} y={dev.y + 33} textAnchor="middle" fill="var(--teal-ink)" fontSize={10}>›</text>
                          </g>
                        </g>
                      );
                    })() : null}

                    {/* Note indicator */}
                    {dev.notes ? (
                      <g onClick={function(e) { e.stopPropagation(); setEditingDeviceNote(dev.id); }}>
                        <rect x={dev.x + 4} y={dev.y + h - 28} width={NODE_W - 8} height={22} rx={4}
                          fill="rgba(var(--note-rgb),calc(0.1 * var(--note-k)))" stroke="rgba(var(--note-rgb),calc(0.2 * var(--note-k)))" strokeWidth={0.5} />
                        <text x={dev.x + 12} y={dev.y + h - 14} fill="var(--note-ink)" fontSize={8} fontFamily="inherit">
                          {dev.notes.length > 32 ? dev.notes.substring(0, 32) + "..." : dev.notes}
                        </text>
                      </g>
                    ) : null}

                    {/* Action buttons when selected */}
                    {isSel ? (
                      <g>
                        <g onClick={function(e) { e.stopPropagation(); deleteDevice(dev.id); }} style={{ cursor: "pointer" }}>
                          <circle cx={dev.x + NODE_W - 14} cy={dev.y + 14} r={9} fill="rgba(255,0,0,0.2)" stroke="rgba(255,80,80,0.5)" strokeWidth={1} />
                          <text x={dev.x + NODE_W - 14} y={dev.y + 18} textAnchor="middle" fill="var(--danger-ink)" fontSize={12}>x</text>
                        </g>
                        <g onClick={function(e) { e.stopPropagation(); setEditingDeviceNote(dev.id); }} style={{ cursor: "pointer" }}>
                          <circle cx={dev.x + NODE_W - 38} cy={dev.y + 14} r={9} fill="rgba(var(--note-rgb),calc(0.15 * var(--note-k)))" stroke="rgba(var(--note-rgb),calc(0.4 * var(--note-k)))" strokeWidth={1} />
                          <text x={dev.x + NODE_W - 38} y={dev.y + 18} textAnchor="middle" fill="var(--note-ink)" fontSize={10}>✎</text>
                        </g>
                        <g onClick={function(e) { e.stopPropagation(); setEditingPorts(dev.id); }} style={{ cursor: "pointer" }}>
                          <circle cx={dev.x + NODE_W - 62} cy={dev.y + 14} r={9} fill="rgba(116,185,255,0.15)" stroke="rgba(116,185,255,0.4)" strokeWidth={1} />

              {/* Caja de seleccion */}
              {marquee ? (

          {/* Connection editor */}
          {selectedConn ? (function() {

            if (!conn) return null;
            var fromDev = devices.find(function(d) { return d.id === conn.from.device; });
            var toDev = devices.find(function(d) { return d.id === conn.to.device; });
            var fromPort = fromDev && fromDev.ports.find(function(p) { return p.id === conn.from.port; });
            var toPort = toDev && toDev.ports.find(function(p) { return p.id === conn.to.port; });
            var kc = KIND_COLORS[conn.kind] || KIND_COLORS.audio;
            return (
              <div style={{ position: "absolute", bottom: 16, left: "50%", transform: "translateX(-50%)",

                gap: 10, backdropFilter: "blur(12px)", zIndex: 30 }}>
                <span title={(fromDev ? fromDev.name : "?") + ":" + (fromPort ? fromPort.name : "?") + " → " + (toDev ? toDev.name : "?") + ":" + (toPort ? toPort.name : "?")}
                  style={{ color: kindInk(conn.kind), fontSize: 11, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 260 }}>
                  {fromDev && fromDev.name}:{fromPort && fromPort.name} &rarr; {toDev && toDev.name}:{toPort && toPort.name}
                </span>
                <input placeholder="Etiqueta..." value={conn.label || ""}
                  onChange={function(e) {
                    var v = e.target.value; var cid = conn.id;
                    setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { label: v }) : c; }); });
                  }}
                  style={Object.assign({}, inputSt, { width: 120 })} />
                <select value={conn.mode || "all"}
                  onChange={function(e) {
                    var v = e.target.value; var cid = conn.id;
                    setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { mode: v }) : c; }); });
                  }}
                  style={selectSt}>
                  <option value="all">Ambos</option>
                  <option value="daw">Solo DAW</option>
                  <option value="jam">Solo Jam</option>
                </select>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9, fontFamily: "inherit" }}>Grosor</span>
                  <input type="range" min="1" max="8" step="0.5"
                    value={conn.strokeW || globalCableW}
                    onChange={function(e) {
                      var v = parseFloat(e.target.value); var cid = conn.id;
                      setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { strokeW: v }) : c; }); });
                    }}
                    style={{ width: 70, accentColor: kc.line }} />
                  <span style={{ color: kc.line, fontSize: 10, fontFamily: "inherit", minWidth: 16 }}>{conn.strokeW || 2}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9, fontFamily: "inherit" }}>Opacidad</span>
                  <input type="range" min="0.05" max="1" step="0.05"
                    value={conn.opacity !== undefined ? conn.opacity : globalCableOp}
                    onChange={function(e) {
                      var v = parseFloat(e.target.value); var cid = conn.id;
                      setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { opacity: v }) : c; }); });
                    }}
                    style={{ width: 70, accentColor: kc.line }} />
                  <span style={{ color: kc.line, fontSize: 10, fontFamily: "inherit", minWidth: 28 }}>{Math.round((conn.opacity !== undefined ? conn.opacity : globalCableOp) * 100)}%</span>
                </div>
                {conn.kind === "midi" ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, paddingLeft: 8, borderLeft: "1px solid rgba(232,185,49,0.25)" }}>
                    <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9 }}>Ch out</span>
                    <select value={conn.midiChannelOut == null ? "" : String(conn.midiChannelOut)}
                      onChange={function(e) {
                        var raw = e.target.value;
                        var v = raw === "" ? null : raw === "omni" ? "omni" : parseInt(raw, 10);
                        var cid = conn.id;
                        setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { midiChannelOut: v }) : c; }); });
                      }}
                      style={Object.assign({}, selectSt, { width: 60 })}>
                      <option value="">—</option>
                      <option value="omni">Omni</option>
                      {Array.from({length:16}, function(_,k){ return k+1; }).map(function(n){ return <option key={n} value={String(n)}>{n}</option>; })}
                    </select>
                    <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9 }}>Ch in</span>
                    <select value={conn.midiChannelIn == null ? "" : String(conn.midiChannelIn)}
                      onChange={function(e) {
                        var raw = e.target.value;
                        var v = raw === "" ? null : raw === "omni" ? "omni" : parseInt(raw, 10);
                        var cid = conn.id;
                        setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { midiChannelIn: v }) : c; }); });
                      }}
                      style={Object.assign({}, selectSt, { width: 60 })}>
                      <option value="">—</option>
                      <option value="omni">Omni</option>
                      {Array.from({length:16}, function(_,k){ return k+1; }).map(function(n){ return <option key={n} value={String(n)}>{n}</option>; })}
                    </select>
                    <label style={{ display: "flex", alignItems: "center", gap: 3, color: "rgba(var(--fg),0.5)", fontSize: 10, cursor: "pointer" }}>
                      <input type="checkbox" checked={!!conn.mpe}
                        onChange={function(e) {
                          var v = e.target.checked; var cid = conn.id;
                          setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { mpe: v, mpeZone: v ? (c.mpeZone || "lower") : null }) : c; }); });
                        }} />
                      MPE
                    </label>
                    {conn.mpe ? (
                      <select value={conn.mpeZone || "lower"}
                        onChange={function(e) {
                          var v = e.target.value; var cid = conn.id;
                          setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { mpeZone: v }) : c; }); });
                        }}
                        style={Object.assign({}, selectSt, { width: 70 })}>
                        <option value="lower">Lower ↓</option>
                        <option value="upper">Upper ↑</option>
                      </select>
                    ) : null}
                  </div>
                ) : null}
                {conn.kind === "adat" ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, paddingLeft: 8, borderLeft: "1px solid rgba(166,108,255,0.35)" }}>
                    <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9 }}>Canales</span>
                    <select value={conn.adatMode || ""}
                      onChange={function(e) {
                        var v = e.target.value || null; var cid = conn.id;
                        setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { adatMode: v }) : c; }); });
                      }}
                      style={Object.assign({}, selectSt, { width: 140 })}>
                      <option value="">—</option>
                      <option value="8">8 ch · 44.1/48 kHz</option>
                      <option value="smux">4 ch · S/MUX 88.2/96 kHz</option>
                    </select>
                    <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9 }}>Clock</span>
                    <select value={conn.adatClock || ""}
                      onChange={function(e) {
                        var v = e.target.value || null; var cid = conn.id;
                        setConnections(function(cs) { return cs.map(function(c) { return c.id === cid ? Object.assign({}, c, { adatClock: v }) : c; }); });
                      }}
                      style={Object.assign({}, selectSt, { width: 120 })}>
                      <option value="">—</option>
                      <option value="from">Origen es master</option>
                      <option value="to">Destino es master</option>
                    </select>
                  </div>
                ) : null}
                <button onClick={function() { deleteConnection(conn.id); }}
                  style={btnStyle("rgba(255,0,0,0.15)","rgba(255,80,80,0.3)","var(--danger-ink)")}>Borrar</button>
              </div>
            );
          })() : null}

          {/* Device note editor */}
          {editingDeviceNote ? (function() {
            var dev = devices.find(function(d) { return d.id === editingDeviceNote; });
            if (!dev) return null;
            return (
              <div style={{ position: "absolute", top: 70, left: "50%", transform: "translateX(-50%)",
                background: "rgba(var(--panel),0.97)", border: "1px solid rgba(var(--note-rgb),calc(0.3 * var(--note-k)))",
                borderRadius: 8, padding: "10px 16px", display: "flex", alignItems: "center",
                gap: 10, backdropFilter: "blur(12px)", zIndex: 30, maxWidth: 600 }}>
                <span style={{ color: dev.color, fontSize: 11, whiteSpace: "nowrap" }}>{dev.name}</span>
                <input placeholder="Nota sobre este dispositivo..." value={dev.notes || ""}
                  onChange={function(e) {
                    var v = e.target.value; var did = editingDeviceNote;
                    setDevices(function(ds) { return ds.map(function(d) { return d.id === did ? Object.assign({}, d, { notes: v }) : d; }); });
                  }}
                  style={Object.assign({}, inputSt, { flex: 1, minWidth: 260 })} />
                <button onClick={function() { setEditingDeviceNote(null); }}
                  style={btnStyle("rgba(var(--fg),0.08)","rgba(var(--fg),0.15)","rgba(var(--fg),0.5)")}>OK</button>
              </div>
            );
          })() : null}

          {/* Edit Ports Modal */}
          {editingPorts ? (function() {
            var dev = devices.find(function(d) { return d.id === editingPorts; });
            if (!dev) return null;
            return (
              <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
                background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
                onClick={function() { setEditingPorts(null); }}>
                <div onClick={function(e) { e.stopPropagation(); }}
                  style={{ background: "rgba(var(--node),0.99)", border: "1px solid " + dev.color + "44",
                    borderRadius: 12, padding: 22, width: 500, maxHeight: "85vh", overflow: "auto" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
                    <div style={{ width: 12, height: 12, borderRadius: 3, background: dev.color }} />
                    <span style={{ color: "rgb(var(--fg))", fontSize: 14, fontWeight: 700, flex: 1 }}>Editar: {dev.name}</span>
                  </div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                    <input value={dev.name}
                      onChange={function(e) {
                        var v = e.target.value; var did = editingPorts;
                        setDevices(function(ds) { return ds.map(function(d) { return d.id === did ? Object.assign({}, d, { name: v }) : d; }); });
                      }}
                      style={Object.assign({}, inputSt, { flex: 1 })} />
                    <input type="color" value={dev.color}
                      onChange={function(e) {
                        var v = e.target.value; var did = editingPorts;
                        setDevices(function(ds) { return ds.map(function(d) { return d.id === did ? Object.assign({}, d, { color: v }) : d; }); });
                      }}
                      style={{ width: 34, height: 30, border: "none", borderRadius: 4, cursor: "pointer", background: "transparent" }} />
                  </div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
                    <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 10, letterSpacing: 1 }}>CATEGORIA</span>
                    {renderTypePicker(dev.type, function(t) {
                      var did = editingPorts;
                      histBreak();
                      setDevices(function(ds) { return ds.map(function(d) { return d.id === did ? Object.assign({}, d, { type: t }) : d; }); });
                    }, "edit:" + dev.id)}
                  </div>
                  <div style={{ borderTop: "1px solid rgba(var(--fg),0.06)", paddingTop: 10, marginBottom: 8 }}>
                    {dev.ports.map(function(port, i) {
                      var hasConn = connections.some(function(c) {
                        return (c.from.device === dev.id && c.from.port === port.id) || (c.to.device === dev.id && c.to.port === port.id);
                      });
                      var isDragging = dragPortIdx === i;
                      return (
                        <div key={port.id}
                          draggable={true}
                          onDragStart={function(e) { setDragPortIdx(i); e.dataTransfer.effectAllowed = "move"; }}
                          onDragOver={function(e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }}
                          onDrop={function(e) {
                            e.preventDefault();
                            var from = dragPortIdx; var to = i; var did = editingPorts;
                            if (from === null || from === to) { setDragPortIdx(null); return; }
                            setDevices(function(ds) { return ds.map(function(d) {
                              if (d.id !== did) return d;
                              var np = d.ports.slice();
                              var moved = np.splice(from, 1)[0];
                              np.splice(to, 0, moved);
                              return Object.assign({}, d, { ports: np });
                            }); });
                            setDragPortIdx(null);
                          }}
                          onDragEnd={function() { setDragPortIdx(null); }}
                          style={{ display: "grid", gridTemplateColumns: "16px 1fr 70px 72px 26px", gap: 5, marginBottom: 5, alignItems: "center", opacity: isDragging ? 0.4 : 1, cursor: "grab" }}>
                          <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 14, textAlign: "center", userSelect: "none", cursor: "grab" }}>⋮⋮</span>
                          <input value={port.name}
                            onChange={function(e) {
                              var v = e.target.value; var did = editingPorts; var ii = i;
                              setDevices(function(ds) { return ds.map(function(d) {
                                if (d.id !== did) return d;
                                var np = d.ports.slice(); np[ii] = Object.assign({}, np[ii], { name: v });
                                return Object.assign({}, d, { ports: np });
                              }); });
                            }}
                            style={inputSt} />
                          <select value={port.dir}
                            onChange={function(e) {
                              var v = e.target.value; var did = editingPorts; var ii = i;
                              setDevices(function(ds) { return ds.map(function(d) {
                                if (d.id !== did) return d;
                                var np = d.ports.slice(); np[ii] = Object.assign({}, np[ii], { dir: v });
                                return Object.assign({}, d, { ports: np });
                              }); });
                            }}
                            style={selectSt}>
                            <option value="in">In</option>
                            <option value="out">Out</option>
                            <option value="both">I/O ⇄ (USB)</option>
                          </select>
                          <select value={port.kind}
                            onChange={function(e) {
                              var v = e.target.value; var did = editingPorts; var ii = i;
                              setDevices(function(ds) { return ds.map(function(d) {
                                if (d.id !== did) return d;
                                var np = d.ports.slice(); np[ii] = Object.assign({}, np[ii], { kind: v });
                                return Object.assign({}, d, { ports: np });
                              }); });
                            }}
                            style={selectSt}>
                            <option value="audio">Audio</option>
                            <option value="midi">MIDI</option>
                            <option value="cv">CV</option>
                            <option value="digital">Digital</option>
                            <option value="adat">ADAT</option>
                          </select>
                          <button
                            onClick={function(e) {
                              e.stopPropagation();
                              var pid = port.id; var did = editingPorts;
                              if (hasConn) { if (!window.confirm("Tiene conexiones. Borrar igualmente?")) return; }
                              setConnections(function(cs) { return cs.filter(function(c) {
                                return !((c.from.device === did && c.from.port === pid) || (c.to.device === did && c.to.port === pid));
                              }); });
                              setDevices(function(ds) { return ds.map(function(d) {
                                if (d.id !== did) return d;
                                return Object.assign({}, d, { ports: d.ports.filter(function(p) { return p.id !== pid; }) });
                              }); });
                            }}
                            style={{ background: "none", border: "none", color: hasConn ? "var(--danger-ink)" : "rgba(var(--fg),0.3)", cursor: "pointer", fontSize: 16, padding: 0 }}>x</button>
                        </div>
                      );
                    })}
                  </div>
                  <button
                    onClick={function() {
                      var did = editingPorts;
                      setDevices(function(ds) { return ds.map(function(d) {
                        if (d.id !== did) return d;
                        var newPort = { id: d.id + "-p-" + Date.now(), name: "Nuevo", dir: "out", kind: "audio" };
                        return Object.assign({}, d, { ports: d.ports.concat([newPort]) });
                      }); });
                    }}
                    style={{ width: "100%", padding: "6px", background: "rgba(var(--fg),0.04)",
                      border: "1px dashed rgba(var(--fg),0.12)", borderRadius: 4,
                      color: "rgba(var(--fg),0.4)", fontSize: 11, cursor: "pointer",
                      fontFamily: "inherit", marginBottom: 14 }}>
                    + Agregar Puerto
                  </button>
                  <div style={{ color: "rgba(var(--fg),0.4)", fontSize: 10, marginBottom: 6, letterSpacing: 1 }}>GENERAR VARIOS</div>
                  {renderBulkRow(function() {
                    var did = editingPorts; var ts = Date.now();
                    setDevices(function(ds) { return ds.map(function(d) {
                      if (d.id !== did) return d;
                      var gen = makeBulkPorts(d.ports).map(function(p, i) {
                        return Object.assign({ id: d.id + "-p-" + ts + "-" + i }, p);
                      });
                      return Object.assign({}, d, { ports: d.ports.concat(gen) });
                    }); });
                  })}
                  <div style={{ marginBottom: 8 }} />
                  <button onClick={function() { setEditingPorts(null); }}
                    style={{ width: "100%", padding: "8px", background: "rgba(116,185,255,0.15)",
                      border: "1px solid rgba(116,185,255,0.3)", borderRadius: 6,
                      color: "var(--blue-ink)", fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
                    Listo
                  </button>
                </div>
              </div>
            );
          })() : null}

          {/* Add Device Modal */}
          {showAdd ? (
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={function() { setShowAdd(false); }}>
              <div onClick={function(e) { e.stopPropagation(); }}
                style={{ background: "rgba(var(--node),0.99)", border: "1px solid rgba(var(--fg),0.1)",
                  borderRadius: 12, padding: 22, width: 460, maxHeight: "80vh", overflow: "auto" }}>
                <h3 style={{ color: "rgb(var(--fg))", margin: "0 0 14px", fontSize: 14, fontFamily: "inherit", fontWeight: 600 }}>Nuevo Dispositivo</h3>
                <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 10 }}>
                  <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 10, letterSpacing: 1 }}>PLANTILLA</span>
                  <select value={tplPick} onChange={function(e) { applyTemplate(e.target.value); }}
                    style={Object.assign({}, selectSt, { flex: 1, minWidth: 0 })}>
                    <option value="">— Vacio —</option>
                    {templates.length > 0 ? (
                      <optgroup label="Mis plantillas">
                        {templates.map(function(t) {
                          return <option key={t.id} value={t.id}>{"★ " + t.name + " (" + t.ports.length + (t.pages ? " · " + t.pages.length + " pag" : "") + ")"}</option>;
                        })}
                      </optgroup>
                    ) : null}
                    <optgroup label="Incluidas">
                      {BUILTIN_TEMPLATES.map(function(t) {
                        return <option key={t.id} value={t.id}>{t.name + " (" + t.ports.length + ")"}</option>;
                      })}
                    </optgroup>
                  </select>
                  {tplPick && !tplPick.startsWith("builtin:") ? (
                    <button title="Borrar esta plantilla" aria-label="Borrar plantilla" onClick={function() { deleteTemplate(tplPick); }}
                      style={Object.assign(btnStyle("transparent", "rgba(var(--fg),0.1)", "var(--danger-ink)"), { padding: "5px 8px" })}>×</button>
                  ) : null}
                </div>
                <input placeholder="Nombre" value={newDevice.name}
                  onChange={function(e) { setNewDevice(function(d) { return Object.assign({}, d, { name: e.target.value }); }); }}
                  style={Object.assign({}, inputSt, { width: "100%", boxSizing: "border-box", marginBottom: 10, fontSize: 13 })} />
                <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "flex-start" }}>
                  {renderTypePicker(newDevice.type, function(t) {
                    setNewDevice(function(d) { return Object.assign({}, d, { type: t }); });
                  }, "new")}
                  <input type="color" value={newDevice.color}
                    onChange={function(e) { setNewDevice(function(d) { return Object.assign({}, d, { color: e.target.value }); }); }}
                    style={{ width: 38, height: 32, border: "none", borderRadius: 4, cursor: "pointer", background: "transparent" }} />
                </div>
                {newPages.length > 1 ? (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ color: "rgba(var(--fg),0.4)", fontSize: 10, marginBottom: 6, letterSpacing: 1 }}>PAGINAS DEL MODULO</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                      {newPages.map(function(pg, i) {
                        return (
                          <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "3px 6px 3px 8px",
                            borderRadius: 4, background: "rgba(var(--fg),0.06)", border: "1px solid rgba(var(--fg),0.12)",
                            color: "rgba(var(--fg),0.8)", fontSize: 10 }}>
                            {(i + 1) + ". " + pg}
                            <button aria-label={"Quitar " + pg} title="Quitar pagina"
                              onClick={function() { setNewPages(function(ps) { return ps.filter(function(_, j) { return j !== i; }); }); }}
                              style={{ background: "none", border: "none", color: "var(--danger-ink)", cursor: "pointer", fontSize: 12, padding: 0 }}>×</button>
                          </span>
                        );
                      })}
                    </div>
                  </div>
                ) : null}
                <div style={{ color: "rgba(var(--fg),0.4)", fontSize: 10, marginBottom: 8, letterSpacing: 1 }}>PUERTOS</div>
                {newPorts.map(function(p, i) {
                  return (
                    <div key={i} style={{ display: "flex", gap: 5, marginBottom: 5, alignItems: "center" }}>
                      <input value={p.name}
                        onChange={function(e) {
                          var v = e.target.value; var ii = i;
                          setNewPorts(function(ps) { var np = ps.slice(); np[ii] = Object.assign({}, np[ii], { name: v }); return np; });
                        }}
                        style={Object.assign({}, inputSt, { flex: 1 })} />
                      <select value={p.dir}
                        onChange={function(e) {
                          var v = e.target.value; var ii = i;
                          setNewPorts(function(ps) { var np = ps.slice(); np[ii] = Object.assign({}, np[ii], { dir: v }); return np; });
                        }}
                        style={selectSt}>
                        <option value="in">In</option><option value="out">Out</option><option value="both">I/O ⇄ (USB)</option>
                      </select>
                      <select value={p.kind}
                        onChange={function(e) {
                          var v = e.target.value; var ii = i;
                          setNewPorts(function(ps) { var np = ps.slice(); np[ii] = Object.assign({}, np[ii], { kind: v }); return np; });
                        }}
                        style={selectSt}>
                        <option value="audio">Audio</option><option value="midi">MIDI</option>
                        <option value="cv">CV</option><option value="digital">Digital</option><option value="adat">ADAT</option>
                      </select>
                      <button onClick={function(e) { var ii = i; setNewPorts(function(ps) { return ps.filter(function(_, j) { return j !== ii; }); }); }}
                        style={{ background: "none", border: "none", color: "var(--danger-ink)", cursor: "pointer", fontSize: 16, padding: 0 }}>x</button>
                    </div>
                  );
                })}
                <button onClick={function() { setNewPorts(function(ps) { return ps.concat([{ name: "Puerto " + (ps.length + 1), dir: "out", kind: "audio" }]); }); }}
                  style={{ width: "100%", padding: "5px", background: "rgba(var(--fg),0.04)",
                    border: "1px dashed rgba(var(--fg),0.12)", borderRadius: 4,
                    color: "rgba(var(--fg),0.4)", fontSize: 11, cursor: "pointer", fontFamily: "inherit", marginBottom: 14 }}>
                  + Puerto
                </button>
                <div style={{ color: "rgba(var(--fg),0.4)", fontSize: 10, marginBottom: 6, letterSpacing: 1 }}>GENERAR VARIOS</div>
                {renderBulkRow(function() { setNewPorts(function(ps) { return ps.concat(makeBulkPorts(ps)); }); })}
                <div style={{ marginBottom: 8 }} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button title="Guardar nombre, categoria, color y puertos como plantilla"
                    onClick={function() {
                      if (newPorts.length === 0 && !newDevice.name.trim()) { showToast("Agrega un nombre o puertos primero"); return; }
                      saveTemplate({ name: newDevice.name, type: newDevice.type, color: newDevice.color, ports: newPorts, pages: newPages });
                    }}
                    style={{ padding: "8px 12px", background: "rgba(var(--note-rgb),calc(0.12 * var(--note-k)))",
                      border: "1px solid rgba(var(--note-rgb),calc(0.4 * var(--note-k)))", borderRadius: 6, color: "var(--note-ink)",
                      fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>★ Plantilla</button>
                  <button onClick={addDevice}
                    style={{ flex: 1, padding: "8px", background: "rgba(0,206,201,0.2)",
                      border: "1px solid var(--teal-ink)", borderRadius: 6, color: "var(--teal-ink)",
                      fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>Crear</button>
                  <button onClick={function() { setShowAdd(false); setTplPick(""); setNewPages([]); }}
                    style={{ padding: "8px 14px", background: "rgba(var(--fg),0.06)",
                      border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6,
                      color: "rgba(var(--fg),0.4)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cancelar</button>
                </div>
              </div>
            </div>
          ) : null}

          {/* Export JSON Modal */}
          {showExportModal ? (
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={function() { setShowExportModal(false); }}>
              <div onClick={function(e) { e.stopPropagation(); }}
                style={{ background: "rgba(var(--node),0.99)", border: "1px solid rgba(var(--fg),0.1)",
                  borderRadius: 12, padding: 22, width: 500, maxHeight: "80vh", display: "flex", flexDirection: "column", gap: 10 }}>
                <h3 style={{ color: "rgb(var(--fg))", margin: 0, fontSize: 14, fontFamily: "inherit" }}>Exportar JSON</h3>
                <p style={{ color: "rgba(var(--fg),0.4)", margin: 0, fontSize: 11, fontFamily: "inherit" }}>Copia este texto y guardalo como archivo .json</p>
                <textarea value={exportData} readOnly onClick={function(e) { e.target.select(); }}
                  style={{ width: "100%", height: 240, boxSizing: "border-box", background: "rgba(var(--shade),calc(0.4 * var(--shade-k)))",
                    border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6, padding: 10,
                    color: "var(--teal-ink)", fontSize: 10, fontFamily: "inherit", resize: "none" }} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={copyToClipboard}
                    style={{ flex: 1, padding: "8px", background: "rgba(0,206,201,0.2)",
                      border: "1px solid var(--teal-ink)", borderRadius: 6, color: "var(--teal-ink)",
                      fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>Copiar</button>
                  <button onClick={function() { setShowExportModal(false); }}
                    style={{ padding: "8px 14px", background: "rgba(var(--fg),0.06)",
                      border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6,
                      color: "rgba(var(--fg),0.4)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cerrar</button>
                </div>
              </div>
            </div>
          ) : null}

          {/* Import JSON Modal */}
          {showImportModal ? (
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={function() { setShowImportModal(false); }}>
              <div onClick={function(e) { e.stopPropagation(); }}
                style={{ background: "rgba(var(--node),0.99)", border: "1px solid rgba(var(--fg),0.1)",
                  borderRadius: 12, padding: 22, width: 500, maxHeight: "80vh", display: "flex", flexDirection: "column", gap: 10 }}>
                <h3 style={{ color: "rgb(var(--fg))", margin: 0, fontSize: 14, fontFamily: "inherit" }}>Importar JSON</h3>
                <p style={{ color: "rgba(var(--fg),0.4)", margin: 0, fontSize: 11, fontFamily: "inherit" }}>Pega aqui el JSON exportado anteriormente</p>
                <textarea value={importText} onChange={function(e) { setImportText(e.target.value); }}
                  placeholder="Pega tu JSON aqui..."
                  style={{ width: "100%", height: 240, boxSizing: "border-box", background: "rgba(var(--shade),calc(0.4 * var(--shade-k)))",
                    border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6, padding: 10,
                    color: "rgb(var(--fg))", fontSize: 10, fontFamily: "inherit", resize: "none" }} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={importFromText}
                    style={{ flex: 1, padding: "8px", background: "rgba(116,185,255,0.2)",
                      border: "1px solid var(--blue-ink)", borderRadius: 6, color: "var(--blue-ink)",
                      fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>Importar</button>
                  <button onClick={function() { setShowImportModal(false); setImportText(""); }}
                    style={{ padding: "8px 14px", background: "rgba(var(--fg),0.06)",
                      border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6,
                      color: "rgba(var(--fg),0.4)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cancelar</button>
                </div>
              </div>
            </div>
          ) : null}

          {/* Snapshots Modal */}
          {showSnapshots ? (
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={function() { setShowSnapshots(false); }}>
              <div onClick={function(e) { e.stopPropagation(); }}
                style={{ background: "rgba(var(--node),0.99)", border: "1px solid rgba(var(--fg),0.1)",
                  borderRadius: 12, padding: 22, width: 440, maxHeight: "80vh", display: "flex", flexDirection: "column", gap: 10 }}>
                <h3 style={{ color: "rgb(var(--fg))", margin: 0, fontSize: 14, fontFamily: "inherit" }}>Versiones Guardadas</h3>
                {savedSnapshots.length === 0 ? (
                  <p style={{ color: "rgba(var(--fg),0.5)", fontSize: 12, fontFamily: "inherit", textAlign: "center", padding: 20 }}>
                    No hay versiones. Usa "Guardar" para crear una.
                  </p>
                ) : (
                  <div style={{ maxHeight: 380, overflow: "auto", display: "flex", flexDirection: "column", gap: 5 }}>
                    {savedSnapshots.map(function(snap) {
                      return (
                        <div key={snap.id} style={{ display: "flex", alignItems: "center", gap: 8,
                          padding: "8px 10px", background: "rgba(var(--fg),0.03)",
                          borderRadius: 6, border: "1px solid rgba(var(--fg),0.06)" }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ color: "rgb(var(--fg))", fontSize: 12, fontFamily: "inherit" }}>{snap.name}</div>
                            <div style={{ color: "rgba(var(--fg),0.5)", fontSize: 9, fontFamily: "inherit" }}>
                              {snap.date} | {snap.data.devices && snap.data.devices.length} devs, {snap.data.connections && snap.data.connections.length} cables
                            </div>
                          </div>
                          <button onClick={function() { loadSnapshot(snap); }}
                            style={btnStyle("rgba(0,206,201,0.15)","rgba(0,206,201,0.3)","var(--teal-ink)")}>Cargar</button>
                          <button onClick={function() { deleteSnapshot(snap.id); }}
                            style={btnStyle("rgba(255,80,80,0.1)","rgba(255,80,80,0.2)","var(--danger-ink)")}>x</button>
                        </div>
                      );
                    })}
                  </div>
                )}
                <button onClick={function() { setShowSnapshots(false); }}
                  style={{ padding: "8px", background: "rgba(var(--fg),0.06)",
                    border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6,
                    color: "rgba(var(--fg),0.4)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cerrar</button>
              </div>
            </div>
          ) : null}

          {/* Hover tooltip */}
          {hoveredPort && !connecting ? (function() {
            var dev = devices.find(function(d) { return d.id === hoveredPort.devId; });
            if (!dev) return null;
            var port = dev.ports.find(function(p) { return p.id === hoveredPort.portId; });
            if (!port) return null;
            var conns = pageConns.filter(function(c) {
              return (c.from.device === hoveredPort.devId && c.from.port === hoveredPort.portId) ||
                     (c.to.device === hoveredPort.devId && c.to.port === hoveredPort.portId);
            });
            var portColor = KIND_COLORS[port.kind] ? KIND_COLORS[port.kind].line : "rgb(var(--fg))";
            return (
              <div style={{ position: "absolute", left: hoveredPort.sx + 14, top: hoveredPort.sy - 10,
                background: "rgba(var(--panel),0.97)", border: "1px solid " + portColor + "55",
                borderRadius: 6, padding: "7px 11px", zIndex: 60, pointerEvents: "none",
                minWidth: 140, maxWidth: 260, backdropFilter: "blur(8px)" }}>
                <div style={{ color: kindInk(port.kind), fontSize: 10, fontWeight: 700, fontFamily: "inherit", marginBottom: 3 }}>
                  {dev.name} / {port.name}
                </div>
                <div style={{ color: "rgba(var(--fg),0.35)", fontSize: 9, fontFamily: "inherit", marginBottom: conns.length > 0 ? 5 : 0 }}>
                  {port.kind} | {port.dir}
                </div>
                {conns.length === 0 ? (
                  <div style={{ color: "rgba(var(--fg),0.5)", fontSize: 9, fontFamily: "inherit" }}>Sin conexiones</div>
                ) : conns.map(function(c, i) {
                  var isFrom = c.from.device === hoveredPort.devId && c.from.port === hoveredPort.portId;
                  var otherDevId = isFrom ? c.to.device : c.from.device;
                  var otherPortId = isFrom ? c.to.port : c.from.port;
                  var otherDev = devices.find(function(d) { return d.id === otherDevId; });
                  var otherPort = otherDev && otherDev.ports.find(function(p) { return p.id === otherPortId; });
                  return (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 5,
                      padding: "2px 0", borderTop: i > 0 ? "1px solid rgba(var(--fg),0.05)" : "none" }}>
                      <span style={{ color: portColor, fontSize: 9 }}>{isFrom ? "→" : "←"}</span>
                      <span style={{ color: "rgba(var(--fg),0.7)", fontSize: 9, fontFamily: "inherit" }}>
                        {otherDev ? otherDev.name : "?"} / {otherPort ? otherPort.name : "?"}
                      </span>
                      {c.label ? <span style={{ color: "rgba(var(--fg),0.35)", fontSize: 8, fontFamily: "inherit" }}>({c.label})</span> : null}
                    </div>
                  );
                })}
                {conns.length > 0 ? (
                  <div style={{ color: "rgba(var(--fg),0.5)", fontSize: 8, fontFamily: "inherit", marginTop: 4 }}>
                    Click para resaltar
                  </div>
                ) : null}
              </div>
            );
          })() : null}

          {/* User Layouts Modal */}
          {showUserLayouts ? (
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={function() { setShowUserLayouts(false); }}>
              <div onClick={function(e) { e.stopPropagation(); }}
                style={{ background: "rgba(var(--node),0.99)", border: "1px solid rgba(232,185,49,0.2)",
                  borderRadius: 12, padding: 22, width: 460, maxHeight: "80vh",
                  display: "flex", flexDirection: "column", gap: 12 }}>
                <h3 style={{ color: "rgb(var(--fg))", margin: 0, fontSize: 14, fontFamily: "inherit", fontWeight: 600 }}>
                  ★ Mis Layouts
                </h3>
                <p style={{ color: "rgba(var(--fg),0.5)", margin: 0, fontSize: 11, fontFamily: "inherit" }}>
                  Guarda la posicion actual de los modulos. Las conexiones no se tocan.
                </p>

                {/* Save current layout */}
                <div style={{ display: "flex", gap: 8 }}>
                  <input
                    placeholder="Nombre del layout (ej: Mi setup favorito)"
                    value={newLayoutName}
                    onChange={function(e) { setNewLayoutName(e.target.value); }}
                    onKeyDown={function(e) { if (e.key === "Enter") saveUserLayout(newLayoutName); }}
                    style={{ flex: 1, background: "rgba(var(--fg),0.06)",
                      border: "1px solid rgba(var(--fg),0.12)", borderRadius: 6,
                      padding: "7px 10px", color: "rgb(var(--fg))", fontSize: 12, fontFamily: "inherit" }} />
                  <button onClick={function() { saveUserLayout(newLayoutName); }}
                    style={{ padding: "7px 14px", background: "rgba(232,185,49,0.2)",
                      border: "1px solid rgba(232,185,49,0.4)", borderRadius: 6,
                      color: "var(--midi-ink)", fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 600,
                      whiteSpace: "nowrap" }}>
                    Guardar actual
                  </button>
                </div>

                {/* List of saved layouts */}
                <div style={{ flex: 1, overflow: "auto", display: "flex", flexDirection: "column", gap: 6 }}>
                  {userLayouts.length === 0 ? (
                    <div style={{ color: "rgba(var(--fg),0.5)", fontSize: 12, fontFamily: "inherit",
                      textAlign: "center", padding: "20px 0" }}>
                      No hay layouts guardados. Acomoda los modulos como quieras y dale "Guardar actual".
                    </div>
                  ) : userLayouts.slice().reverse().map(function(layout) {
                    return (
                      <div key={layout.id} style={{ display: "flex", alignItems: "center", gap: 8,
                        padding: "9px 12px", background: "rgba(var(--fg),0.03)",
                        border: "1px solid rgba(var(--fg),0.06)", borderRadius: 7 }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ color: "rgb(var(--fg))", fontSize: 12, fontFamily: "inherit", fontWeight: 600 }}>
                            {layout.name}
                          </div>
                          <div style={{ color: "rgba(var(--fg),0.5)", fontSize: 9, fontFamily: "inherit", marginTop: 2 }}>
                            {layout.date} | {Object.keys(layout.positions).length} modulos
                          </div>
                        </div>
                        <button onClick={function() { loadUserLayout(layout); setShowUserLayouts(false); }}
                          style={{ padding: "5px 12px", background: "rgba(232,185,49,0.15)",
                            border: "1px solid rgba(232,185,49,0.3)", borderRadius: 5,
                            color: "var(--midi-ink)", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>
                          Cargar
                        </button>
                        <button onClick={function() { deleteUserLayout(layout.id); }}
                          style={{ padding: "5px 8px", background: "rgba(255,80,80,0.1)",
                            border: "1px solid rgba(255,80,80,0.2)", borderRadius: 5,
                            color: "var(--danger-ink)", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>
                          x
                        </button>
                      </div>
                    );
                  })}
                </div>

                <button onClick={function() { setShowUserLayouts(false); }}
                  style={{ padding: "8px", background: "rgba(var(--fg),0.06)",
                    border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6,
                    color: "rgba(var(--fg),0.4)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
                  Cerrar
                </button>
              </div>
            </div>
          ) : null}

          {/* Reset Modal */}
          {showReset ? (
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(var(--shade),calc(0.7 * var(--shade-k)))", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={function() { setShowReset(false); }}>
              <div role="dialog" aria-label="Reset" onClick={function(e) { e.stopPropagation(); }}
                style={{ background: "rgba(var(--node),0.99)", border: "1px solid rgba(var(--fg),0.1)", borderRadius: 12,
                  padding: 22, width: 400, display: "flex", flexDirection: "column", gap: 10 }}>
                <h3 style={{ color: "rgb(var(--fg))", margin: 0, fontSize: 14, fontFamily: "inherit" }}>Reset</h3>
                <p style={{ color: "rgba(var(--fg),0.55)", margin: 0, fontSize: 11, lineHeight: 1.5 }}>
                  Se borran dispositivos, cables, notas y paginas. Tus categorias, plantillas, versiones y layouts se conservan.
                  Se puede deshacer con Ctrl+Z.
                </p>
                <button onClick={function() { resetStudio("empty"); }}
                  style={{ padding: "10px", background: "rgba(255,80,80,0.12)", border: "1px solid rgba(255,80,80,0.4)", borderRadius: 6,
                    color: "var(--danger-ink)", fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 600, textAlign: "left" }}>
                  Vaciar todo
                  <div style={{ fontWeight: 400, fontSize: 10, color: "rgba(var(--fg),0.5)", marginTop: 2 }}>Lienzo en blanco para armar tu estudio</div>
                </button>
                <button onClick={function() { resetStudio("example"); }}
                  style={{ padding: "10px", background: "rgba(var(--fg),0.05)", border: "1px solid rgba(var(--fg),0.12)", borderRadius: 6,
                    color: "rgb(var(--fg))", fontSize: 12, cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                  Cargar estudio de ejemplo
                  <div style={{ fontSize: 10, color: "rgba(var(--fg),0.5)", marginTop: 2 }}>{DEFAULT_DEVICES.length} equipos (Hapax, MRCC, Octatrack, MOTU...)</div>
                </button>
                <button onClick={function() { setShowReset(false); }}
                  style={{ padding: "8px", background: "transparent", border: "1px solid rgba(var(--fg),0.1)", borderRadius: 6,
                    color: "rgba(var(--fg),0.5)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cancelar</button>
              </div>
            </div>
          ) : null}

          {/* Toast */}
          {toastMsg ? (
            <div style={{ position: "absolute", top: 52, left: "50%", transform: "translateX(-50%)",
              background: "rgba(var(--panel),0.97)", border: "1px solid rgba(0,206,201,0.4)",
              borderRadius: 8, padding: "7px 18px", zIndex: 60, backdropFilter: "blur(12px)" }}>
              <span style={{ color: "var(--teal-ink)", fontSize: 12, fontFamily: "inherit" }}>{toastMsg}</span>
            </div>
          ) : null}

          {/* Help */}
          <div style={{ position: "absolute", bottom: 12, right: 14, color: "rgba(var(--fg),0.4)",
            fontSize: 9, fontFamily: "inherit", textAlign: "right", lineHeight: 1.6, zIndex: 10 }}>
            Click puerto = conectar | Shift+click puerto = resaltar conexiones | Shift+click nodo / Shift+arrastrar fondo = seleccion multiple | Click derecho = menu | Doble click puerto = renombrar | Ctrl+click cable = multi-cables | Ctrl+Z / Ctrl+Shift+Z = deshacer / rehacer | Ctrl+D = duplicar | Esc = cancelar
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(StudioRouter, null));
  </script>
</body>
</html>
