  <title>Studio Router</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --fg: 255,255,255;        /* texto / lineas (usado como rgba(var(--fg),a)) */
      --bg: #0a0a0f;            /* canvas */
      --panel: 12,12,22;        /* toolbar, modales, menus */
      --node: 18,18,28;         /* cuerpo de nodos */
      --shade: 0,0,0;           /* sombras / overlays */
      --shade-k: 1;             /* intensidad de sombras */
      --teal-ink: #00CEC9;
      --midi-ink: #E8B931;
      --note-ink: #FFEAA7;
      --blue-ink: #74B9FF;
      --select-bg: #1a1a2e;
      --teal-soft: rgba(0,206,201,0.7);
      --blue-soft: rgba(116,185,255,0.7);
      --red-soft: rgba(255,80,80,0.6);
      --note-rgb: 255,234,167;
      --audio-ink: #00CEC9;
      --cv-ink: #E84393;
      --digital-ink: #74B9FF;
      --adat-ink: #B98CFF;
      --danger-ink: #ff5050;
      --flow-in: #55EFC4;
      --flow-out: #FF7675;
      --note-k: 1;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --fg: 24,26,40;
      --bg: #eceef3;
      --panel: 255,255,255;
      --node: 255,255,255;
      --shade: 40,40,70;
      --shade-k: 0.35;
      --teal-ink: #00938f;
      --midi-ink: #a87e0f;
      --note-ink: #9a7b12;
      --blue-ink: #2f7fd6;
      --select-bg: #ffffff;
      --teal-soft: #00938f;
      --blue-soft: #2f7fd6;
      --red-soft: #d63c3c;
      --note-rgb: 200,150,20;
      --audio-ink: #00938f;
      --cv-ink: #c2185b;
      --digital-ink: #2f7fd6;
      --adat-ink: #7440d6;
      --danger-ink: #d63c3c;
      --flow-in: #00a37a;
      --flow-out: #d64545;
      --note-k: 1.6;
    }
    body { overflow: hidden; background: var(--bg); }
    select, select option { background-color: var(--select-bg) !important; color: rgb(var(--fg)) !important; }
    select option:checked { background-color: #2E75B6 !important; color: #fff !important; }
  </style>
  <script>
    (function() {
      var t = null;
      try { t = localStorage.getItem("studio-router-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

    // ─── HELPERS ───

    // Vista activa: {kinds: [] (vacio = todos), dir: null | "in" | "out"}. Los puertos I/O cuentan como ambos.
    var FULL_VIEW = { kinds: [], dir: null };
    function viewIsFull(view) { return !view || (view.kinds.length === 0 && !view.dir); }
    function kindOk(p, view) { return !view || view.kinds.length === 0 || view.kinds.indexOf(p.kind) >= 0; }
    function dirOk(p, view) { return !view || !view.dir || p.dir === view.dir || p.dir === "both"; }
    function visiblePorts(dev, view) {
      if (viewIsFull(view)) return dev.ports;
      return dev.ports.filter(function(p) { return kindOk(p, view) && dirOk(p, view); });
    }

    // Filas de puertos: entradas y salidas comparten filas; los I/O (bidireccionales) van en filas propias al fondo
    function portRows(ports) {
      var ins = 0, outs = 0, both = 0;
      ports.forEach(function(p) {
        if (p.dir === "both") both++;
        else if (p.dir === "out") outs++;
        else ins++;
      });
      return { io: Math.max(ins, outs), both: both, total: Math.max(ins, outs) + both };
    }

    // Esquinas redondeadas sobre una polilinea [[x,y], ...]
    function roundedPath(pts, r) {
      var d = "M" + pts[0][0] + "," + pts[0][1];
      for (var i = 1; i < pts.length - 1; i++) {
        var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        var l1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
        var l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        var rr = Math.min(r, l1 / 2, l2 / 2);
        if (rr < 0.5) { d += " L" + p1[0] + "," + p1[1]; continue; }
        var ax = p1[0] + (p0[0] - p1[0]) * rr / l1, ay = p1[1] + (p0[1] - p1[1]) * rr / l1;
        var bx = p1[0] + (p2[0] - p1[0]) * rr / l2, by = p1[1] + (p2[1] - p1[1]) * rr / l2;
        d += " L" + ax + "," + ay + " Q" + p1[0] + "," + p1[1] + " " + bx + "," + by;
      }
      var last = pts[pts.length - 1];
      return d + " L" + last[0] + "," + last[1];
    }

    // Hash estable de un id → entero (para repartir cables en carriles)
    function idSeed(id) {
      var h = 0;
      for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    function portRowY(dev, row, rows) {
      var extra = rows.both > 0 && rows.io > 0 && row >= rows.io ? 4 : 0;
      return dev.y + HEADER_H + PORT_PAD + row * (PORT_H + PORT_PAD) + extra;
    }

    function nodeHeight(dev, kind) {
      var rows = portRows(visiblePorts(dev, kind));
      var base = HEADER_H + rows.total * (PORT_H + PORT_PAD) + PORT_PAD * 2 + (rows.both > 0 && rows.io > 0 ? 4 : 0);

      var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
      if (!m) return hex;
      var n = parseInt(m[1], 16);
      var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function(c) {

    // ADAT: 8 canales a 44.1/48 kHz, 4 canales con S/MUX a 88.2/96 kHz; el reloj lo da un extremo
    function adatStr(c) {

      var connections = (Array.isArray(d.connections) ? d.connections : []).filter(function(c) {

        var t = e.target;
        var tag = t && t.tagName;
        var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable);
        if (e.key === "Escape") {
          if (ctxMenu) { setCtxMenu(null); return; }
          if (typing) return;
          if (modalOpen || editingDeviceNote) { closeModals(); return; }
          setMarquee(null); setConnecting(null); setFocusedPort(null);
          setSelected(null); setMultiSelect([]); setSelectedConn(null); setMultiSelectConn([]); setSelectedNote(null);
          return;
        }
        if (typing || modalOpen) return;
        if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelection(); return; }
        if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.ctrlKey && !e.metaKey) {
          var delta = e.key === "ArrowLeft" ? -1 : 1;
          // Con un modulo con paginas seleccionado, navega sus paginas; si no, las paginas globales
          if (selected && gotoModPage(selected, delta)) { e.preventDefault(); return; }
          if (pages.length > 1) { e.preventDefault(); gotoPage(delta); }
          return;
        }
        if (!(e.ctrlKey || e.metaKey)) return;
        var k = e.key.toLowerCase();
        if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
        else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
        else if (k === "d") { e.preventDefault(); duplicateSelection(); }
        else if (k === "a") { e.preventDefault(); selectAll(); }
      }

      // Listeners globales registrados una sola vez; llaman a los handlers del render actual via ref
      latest.current.onKey = onKey;
      useEffect(function() {
        function key(e) { latest.current.onKey(e); }
        function up(e) { latest.current.pointerUp(e); }
        function wheel(e) { latest.current.wheel(e); }
        var svg = svgRef.current;
        window.addEventListener("keydown", key);
        window.addEventListener("pointerup", up);
        // wheel no-pasivo para que preventDefault funcione (pinch/ctrl+rueda no hace zoom a la pagina) (20)
        if (svg) svg.addEventListener("wheel", wheel, { passive: false });
        return function() {
          window.removeEventListener("keydown", key);
          window.removeEventListener("pointerup", up);
          if (svg) svg.removeEventListener("wheel", wheel);
        };
      }, []);

      // ── Cerrar menu contextual al hacer click fuera (fase de captura: nodos/notas frenan la propagacion) ──
      useEffect(function() {
        if (!ctxMenu) return;
        function close(e) {
          if (e && e.target && ctxMenuRef.current && ctxMenuRef.current.contains(e.target)) return;
          setCtxMenu(null);
        }
        window.addEventListener("pointerdown", close, true);
        window.addEventListener("blur", close);
        return function() {
          window.removeEventListener("pointerdown", close, true);
          window.removeEventListener("blur", close);
        };
      }, [ctxMenu]);

      // ── Auto-save con debounce (6, 18) ──
      var savePayload = useRef(null);
      function flushSave() {
        if (!savePayload.current) return;
        try { localStorage.setItem("studio-router-data", JSON.stringify(savePayload.current)); } catch(e) {}
        savePayload.current = null;
      }
      useEffect(function() {
        if (!loaded.current || !hist.current.ready) return;
        savePayload.current = { devices: devices, connections: connections, stickyNotes: stickyNotes, pages: pages,
          curPage: curPage, modPage: modPage, customTypes: customTypes, pan: pan, zoom: zoom };
        var t = setTimeout(flushSave, 300);
        return function() { clearTimeout(t); };
      }, [devices, connections, stickyNotes, pages, curPage, modPage, customTypes, pan, zoom]);
      useEffect(function() {
        window.addEventListener("beforeunload", flushSave);
        return function() { window.removeEventListener("beforeunload", flushSave); };
      }, []);

      function showToast(msg) {
        setToastMsg(msg);
        setTimeout(function() { setToastMsg(""); }, 3000);
      }

      function screenToWorld(sx, sy) {
        return { x: (sx - pan.x) / zoom, y: (sy - pan.y) / zoom };
      }

      // ── Wheel zoom ──
      function handleWheel(e) {
        e.preventDefault();
        if (ctxMenu) setCtxMenu(null);
        var delta = e.deltaY > 0 ? 0.92 : 1.08;
        var nz = Math.max(0.15, Math.min(2.5, zoom * delta));
        var rect = svgRef.current.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        setPan(function(p) {
          return { x: mx - (mx - p.x) * (nz / zoom), y: my - (my - p.y) * (nz / zoom) };
        });
        setZoom(nz);
      }
      latest.current.wheel = handleWheel;

      // ── Pointer events ──
      function handlePointerDown(e) {
        if (e.target === svgRef.current || e.target.classList.contains("bg-grid")) {
          if (e.button === 2) return; // click derecho: lo maneja onContextMenu
          if (connecting) { setConnecting(null); return; }
          histBreak();
          setSelectedNote(null);
          if (e.shiftKey && e.button === 0) {
            // Caja de seleccion (Shift + arrastrar en el fondo); suma a la seleccion actual
            var rect0 = svgRef.current.getBoundingClientRect();
            var w0 = screenToWorld(e.clientX - rect0.left, e.clientY - rect0.top);
            setMarquee({ x0: w0.x, y0: w0.y, x1: w0.x, y1: w0.y,
              base: multiSelect.length > 0 ? multiSelect.slice() : (selected ? [selected] : []) });
            setSelected(null);
            setSelectedConn(null);
            setMultiSelectConn([]);
            setFocusedPort(null);
            return;
          }
          setIsPanning(true);
          setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
          setSelected(null);
          setSelectedConn(null);
          setMultiSelect([]);
          setMultiSelectConn([]);
          setFocusedPort(null);
          setShowLayouts(false);
          setShowCableStyle(false);
          setShowUserLayouts(false);
        }
      }

      function handlePointerMove(e) {
        var rect = svgRef.current.getBoundingClientRect();
        var sx = e.clientX - rect.left;
        var sy = e.clientY - rect.top;
        if (connecting) setMousePos(screenToWorld(sx, sy)); // solo la linea de preview lo usa (16)
        if (marquee) {
          var wm = screenToWorld(sx, sy);
          setMarquee(function(m) { return m ? Object.assign({}, m, { x1: wm.x, y1: wm.y }) : m; });
          return;
        }
        if (isPanning && panStart) {
          setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
          return;
        }
        if (draggingNote2) {
          var w2 = screenToWorld(sx, sy);
          setStickyNotes(function(ns) {
            return ns.map(function(n) {
              if (n.id !== draggingNote2.id) return n;
              var nx = w2.x - draggingNote2.ox, ny = w2.y - draggingNote2.oy;
              if (nx === n.x && ny === n.y) return n;
              return Object.assign({}, n, { x: nx, y: ny });
            });
          });
          return;
        }
        if (!dragging) return;
        // Posiciones absolutas desde el inicio del drag: sin acumulacion aunque lleguen varios moves por render (13)
        var w = screenToWorld(sx, sy);
        var dx = w.x - dragging.w0.x;
        var dy = w.y - dragging.w0.y;
        var last = dragDelta.current;
        if (last && last.dx === dx && last.dy === dy) return;
        if (!last && dx === 0 && dy === 0) return;
        dragDelta.current = { dx: dx, dy: dy };
        var starts = dragging.starts;
        setDevices(function(ds) {
          return ds.map(function(d) {
            var st = starts[d.id];
            return st ? Object.assign({}, d, { x: st.x + dx, y: st.y + dy }) : d;
          });
        });
      }

      function handlePointerUp() {
        if (!marquee && !dragging && !draggingNote2 && !isPanning) return;
        if (marquee) {
          var mx0 = Math.min(marquee.x0, marquee.x1), mx1 = Math.max(marquee.x0, marquee.x1);
          var my0 = Math.min(marquee.y0, marquee.y1), my1 = Math.max(marquee.y0, marquee.y1);
          var ids = marquee.base.slice();
          devices.filter(isDevVisible).forEach(function(d) {
            var h = nodeHeight(d, filter);
            var hit = d.x < mx1 && d.x + NODE_W > mx0 && d.y < my1 && d.y + h > my0;
            if (hit && ids.indexOf(d.id) < 0) ids.push(d.id);
          });
          setMultiSelect(ids);
          setSelected(null);
          setMarquee(null);
        }
        if (dragging || draggingNote2) histBreak();
        dragDelta.current = null;
        setDragging(null);
        setDraggingNote2(null);
        setIsPanning(false);
        setPanStart(null);
      }
      latest.current.pointerUp = handlePointerUp;

      function startDrag(dev, e) {
        e.stopPropagation();
        if (e.button === 2) return;
        var rect = svgRef.current.getBoundingClientRect();
        var w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        if (e.shiftKey) {
          var devId = dev.id;
          setMultiSelect(function(ms) {
            if (ms.indexOf(devId) >= 0) return ms.filter(function(id) { return id !== devId; });
            return ms.concat([devId]);
          });
          setSelected(null);
          return;
        }
        histBreak();
        var group = multiSelect.length > 0 && multiSelect.indexOf(dev.id) >= 0 ? multiSelect : [dev.id];
        var starts = {};
        devices.forEach(function(d) { if (group.indexOf(d.id) >= 0) starts[d.id] = { x: d.x, y: d.y }; });
        dragDelta.current = null;
        setDragging({ id: dev.id, w0: w, starts: starts });
        if (group.length > 1) {
          setSelected(null);
        } else {
          setSelected(dev.id);
          setMultiSelect([]);
        }
        setSelectedConn(null);
        setSelectedNote(null);
      }

      function startConnect(devId, portId, e) {
        e.stopPropagation();
        if (connecting) {
          if (connecting.devId !== devId) {
            var srcPort = devices.find(function(d) { return d.id === connecting.devId; });
            srcPort = srcPort && srcPort.ports.find(function(p) { return p.id === connecting.portId; });
            var tgtPort = devices.find(function(d) { return d.id === devId; });
            tgtPort = tgtPort && tgtPort.ports.find(function(p) { return p.id === portId; });
            var dup = connections.some(function(c) {
              return connPageOk(c) && c.from.device === connecting.devId && c.from.port === connecting.portId &&
                c.to.device === devId && c.to.port === portId;
            });
            var mpage = null;
            [connecting.devId, devId].forEach(function(did) {
              var mp = curModPage(devById[did]);
              if (mp) { mpage = mpage || {}; mpage[did] = mp; }
            });
            if (dup) showToast("Ese cable ya existe");
            if (srcPort && tgtPort && !dup) {
              histBreak();
              setConnections(function(cs) {
                return cs.concat([{
                  id: "c-" + Date.now(),
                  from: { device: connecting.devId, port: connecting.portId },
                  to: { device: devId, port: portId },
                  kind: srcPort.kind, label: "", mode: "all", page: curPageId(), mpage: mpage || undefined,
                }]);
              });
            }
          }
          setConnecting(null);
        } else {
          setConnecting({ devId: devId, portId: portId });
        }
      }

      function deleteDevice(id) {
        histBreak();
        setDevices(function(ds) { return ds.filter(function(d) { return d.id !== id; }); });
        setConnections(function(cs) { return cs.filter(function(c) { return c.from.device !== id && c.to.device !== id; }); });
        setSelected(null);
      }

      function deleteMultiple() {
        histBreak();
        var ids = multiSelect;
        setDevices(function(ds) { return ds.filter(function(d) { return ids.indexOf(d.id) < 0; }); });
        setConnections(function(cs) { return cs.filter(function(c) { return ids.indexOf(c.from.device) < 0 && ids.indexOf(c.to.device) < 0; }); });
        setMultiSelect([]);
      }

      function deleteConnection(id) {
        histBreak();
        setConnections(function(cs) { return cs.filter(function(c) { return c.id !== id; }); });
        setSelectedConn(null);
      }

      function deleteMultipleConnections() {
        histBreak();
        var ids = multiSelectConn;
        setConnections(function(cs) { return cs.filter(function(c) { return ids.indexOf(c.id) < 0; }); });
        setMultiSelectConn([]);
      }

      function duplicateSelection() {
        var ids = multiSelect.length > 0 ? multiSelect : (selected ? [selected] : []);
        if (ids.length === 0) { showToast("Selecciona un nodo para duplicar"); return; }
        histBreak();
        var ts = Date.now();
        var devMap = {};
        var portMap = {};
        var copies = devices.filter(function(d) { return ids.indexOf(d.id) >= 0; }).map(function(d, i) {
          var nid = "dev-" + ts + "-" + i;
          devMap[d.id] = nid;
          return Object.assign({}, d, {
            id: nid, name: d.name + " copia", x: d.x + 40, y: d.y + 40,
            ports: d.ports.map(function(p, j) {
              var pid = nid + "-p" + j;
              portMap[d.id + "|" + p.id] = pid;
              return Object.assign({}, p, { id: pid });
            }),
          });
        });
        // Solo cables internos (ambos extremos dentro de la seleccion)
        var newConns = connections.filter(function(c) {
          return devMap[c.from.device] && devMap[c.to.device];
        }).map(function(c, i) {
          return Object.assign({}, c, {
            id: "c-" + ts + "-" + i,
            mpage: c.mpage ? Object.keys(c.mpage).reduce(function(acc, k) { acc[devMap[k] || k] = c.mpage[k]; return acc; }, {}) : c.mpage,
            from: { device: devMap[c.from.device], port: portMap[c.from.device + "|" + c.from.port] },
            to: { device: devMap[c.to.device], port: portMap[c.to.device + "|" + c.to.port] },
          });
        });
        setDevices(function(ds) { return ds.concat(copies); });
        if (newConns.length > 0) setConnections(function(cs) { return cs.concat(newConns); });
        var newIds = copies.map(function(d) { return d.id; });
        if (newIds.length > 1) { setMultiSelect(newIds); setSelected(null); }
        else { setSelected(newIds[0]); setMultiSelect([]); }
        showToast("Duplicado: " + copies.length + (copies.length === 1 ? " nodo" : " nodos"));
      }

      function selectAll() {
        var ids = devices.filter(isDevVisible).map(function(d) { return d.id; });
        setMultiSelect(ids);
        setSelected(null);
        setCtxMenu(null);
      }

      // ── Menu contextual (click derecho) ──
      function openCtx(e, kind, id) {
        if (e.target && e.target.isContentEditable) { e.stopPropagation(); return; } // menu nativo al editar texto
        e.preventDefault();
        e.stopPropagation();
        if (connecting) { setConnecting(null); setCtxMenu(null); return; }
        var rect = svgRef.current.getBoundingClientRect();
        var world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        if (kind === "dev" && multiSelect.indexOf(id) < 0) {
          setSelected(id); setMultiSelect([]);
          setSelectedConn(null); setMultiSelectConn([]);
        }
        if (kind === "conn" && multiSelectConn.indexOf(id) < 0) {
          setSelectedConn(id); setMultiSelectConn([]);
          setSelected(null); setMultiSelect([]);
        }
        if (kind === "note") setSelectedNote(id);
        if (kind === "port" && multiSelect.indexOf(id.devId) < 0) {
          setSelected(id.devId); setMultiSelect([]);
          setSelectedConn(null); setMultiSelectConn([]);
        }
        setShowLayouts(false);
        setShowCableStyle(false);
        setCtxMenu({ kind: kind, id: id, sx: e.clientX, sy: e.clientY, world: world });
      }

      // Solo la pagina visible: los cables de otras paginas no se tocan
      function disconnectDevices(ids) {
        setConnections(function(cs) {
          return cs.filter(function(c) {
            return !connPageOk(c) || (ids.indexOf(c.from.device) < 0 && ids.indexOf(c.to.device) < 0);
          });
        });
      }

      // ── Categorias de dispositivo (fijas + creadas por el usuario + las que traigan datos importados) ──
      function typeIcon(t) {
        if (TYPE_ICONS[t]) return TYPE_ICONS[t];
        var c = customTypes.find(function(x) { return x.name === t; });
        return c ? c.icon : "●";
      }

      function allTypes() {
        var list = Object.keys(TYPE_ICONS);
        customTypes.forEach(function(c) { if (list.indexOf(c.name) < 0) list.push(c.name); });
        devices.forEach(function(d) { if (d.type && list.indexOf(d.type) < 0) list.push(d.type); });
        return list;
      }

      function addCustomType(onPick) {
        var name = (typeDraft && typeDraft.name || "").trim();
        if (!name) { showToast("Escribe un nombre para la categoria"); return; }
        var existing = allTypes().find(function(t) { return t.toLowerCase() === name.toLowerCase(); });
        if (!existing) {
          var icon = (typeDraft.icon || "").trim() || "●";
          setCustomTypes(function(cs) { return cs.concat([{ name: name, icon: icon }]); });
          showToast("Categoria creada: " + name);
        }
        onPick(existing || name);
        setTypeDraft(null);
      }

      function isCustomType(t) { return !!t && !TYPE_ICONS[t]; }

      // Renombra una categoria propia (nombre y/o icono) y actualiza los dispositivos que la usan
      function renameCustomType(onPick) {
        var old = typeDraft.old;
        var name = (typeDraft.name || "").trim();
        if (!name) { showToast("Escribe un nombre para la categoria"); return; }
        var clash = allTypes().find(function(t) { return t !== old && t.toLowerCase() === name.toLowerCase(); });
        if (clash) { showToast("Ya existe la categoria \"" + clash + "\""); return; }
        var icon = (typeDraft.icon || "").trim() || "●";
        histBreak();
        setCustomTypes(function(cs) {
          var found = cs.some(function(c) { return c.name === old; });
          var next = cs.map(function(c) { return c.name === old ? { name: name, icon: icon } : c; });
          return found ? next : next.concat([{ name: name, icon: icon }]);
        });
        if (name !== old) {
          setDevices(function(ds) { return ds.map(function(d) { return d.type === old ? Object.assign({}, d, { type: name }) : d; }); });
          setNewDevice(function(d) { return d.type === old ? Object.assign({}, d, { type: name }) : d; });
        }
        onPick(name);
        setTypeDraft(null);
        showToast("Categoria actualizada: " + name);
      }

      // Borra una categoria propia; los dispositivos que la usaban pasan a "synth"
      function deleteCustomType(t, onPick) {
        var n = devices.filter(function(d) { return d.type === t; }).length;
        var msg = "Borrar la categoria \"" + t + "\"?" + (n > 0 ? "\n" + n + " dispositivo(s) pasaran a \"synth\"." : "");
        if (!window.confirm(msg)) return;
        histBreak();
        setCustomTypes(function(cs) { return cs.filter(function(c) { return c.name !== t; }); });
        if (n > 0) setDevices(function(ds) { return ds.map(function(d) { return d.type === t ? Object.assign({}, d, { type: "synth" }) : d; }); });
        setNewDevice(function(d) { return d.type === t ? Object.assign({}, d, { type: "synth" }) : d; });
        onPick("synth");
        setTypeDraft(null);
        showToast("Categoria borrada: " + t);
      }

      // Selector de categoria con opcion "+ Nueva categoria..." (fila inline para nombre e icono)
      function renderTypePicker(value, onPick, target) {
        var open = typeDraft && typeDraft.target === target;
        var renaming = open && typeDraft.mode === "rename";
        var submit = function() { if (renaming) renameCustomType(onPick); else addCustomType(onPick); };
        var smallBtn = function(color) {
          return Object.assign(btnStyle("transparent", "rgba(var(--fg),0.1)", color), { padding: "5px 8px" });
        };
        return (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 6, minWidth: 0 }}>
            <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
              <select value={open && !renaming ? "__new" : value}
                onChange={function(e) {
                  var v = e.target.value;
                  if (v === "__new") setTypeDraft({ mode: "new", name: "", icon: "", target: target });
                  else { setTypeDraft(null); onPick(v); }
                }}
                style={Object.assign({}, selectSt, { flex: 1, minWidth: 0 })}>
                {allTypes().map(function(t) { return <option key={t} value={t}>{typeIcon(t) + "  " + t}</option>; })}
                <option value="__new">＋ Nueva categoria...</option>
              </select>
              {isCustomType(value) && !open ? (
                <button title="Renombrar categoria / cambiar icono" aria-label="Renombrar categoria"
                  onClick={function() { setTypeDraft({ mode: "rename", old: value, name: value, icon: typeIcon(value), target: target }); }}
                  style={smallBtn("var(--note-ink)")}>✎</button>
              ) : null}
              {isCustomType(value) && !open ? (
                <button title="Borrar categoria" aria-label="Borrar categoria"
                  onClick={function() { deleteCustomType(value, onPick); }}
                  style={smallBtn("var(--danger-ink)")}>×</button>
              ) : null}
            </div>
            {open ? (
              <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
                <input autoFocus placeholder="Nombre (ej. drum-synth)" value={typeDraft.name}
                  onChange={function(e) { var v = e.target.value; setTypeDraft(function(t) { return Object.assign({}, t, { name: v }); }); }}
                  onKeyDown={function(e) { if (e.key === "Enter") submit(); else if (e.key === "Escape") { e.stopPropagation(); setTypeDraft(null); } }}
                  style={Object.assign({}, inputSt, { flex: 1, minWidth: 0 })} />
                <input placeholder="●" title="Icono (un simbolo o emoji)" maxLength={2} value={typeDraft.icon}
                  onChange={function(e) { var v = e.target.value; setTypeDraft(function(t) { return Object.assign({}, t, { icon: v }); }); }}
                  onKeyDown={function(e) { if (e.key === "Enter") submit(); }}
                  style={Object.assign({}, inputSt, { width: 38, textAlign: "center" })} />
                <button onClick={submit}
                  style={btnStyle("rgba(0,206,201,0.15)", "rgba(0,206,201,0.4)", "var(--teal-ink)")}>{renaming ? "Guardar" : "Agregar"}</button>
                <button onClick={function() { setTypeDraft(null); }} aria-label="Cancelar"
                  style={Object.assign(btnStyle("transparent", "rgba(var(--fg),0.1)", "rgba(var(--fg),0.5)"), { padding: "5px 8px" })}>×</button>
              </div>
            ) : null}
          </div>
        );
      }

      // ── Paginas globales ──
      function curPageId() {
        return pages.some(function(pg) { return pg.id === curPage; }) ? curPage : pages[0].id;
      }

      // Pagina activa de un modulo (null si el modulo no tiene paginas propias)
      function curModPage(dev) {
        if (!dev || !dev.pages || dev.pages.length === 0) return null;
        var id = modPage[dev.id];
        return dev.pages.some(function(pg) { return pg.id === id; }) ? id : dev.pages[0].id;
      }

      function connPageOf(c, dev) {
        return (c.mpage && c.mpage[dev.id]) || dev.pages[0].id;
      }

      // Un cable se ve si pertenece a la pagina global actual y a la pagina activa de cada modulo con paginas
      function connPageOk(c) {
        if ((c.page || pages[0].id) !== curPageId()) return false;
        var ends = [c.from.device, c.to.device];
        for (var i = 0; i < 2; i++) {
          var d = devById[ends[i]];
          if (d && d.pages && d.pages.length > 0 && connPageOf(c, d) !== curModPage(d)) return false;
        }
        return true;
      }

      function pageLabel(c) {
        var pg = pages.find(function(x) { return x.id === (c.page || pages[0].id); });
        var parts = [pg ? pg.name : "?"];
        [c.from.device, c.to.device].forEach(function(did) {
          var d = devById[did];
          if (d && d.pages && d.pages.length > 1) {
            var mp = d.pages.find(function(x) { return x.id === connPageOf(c, d); });
            parts.push(d.name + ": " + (mp ? mp.name : "?"));
          }
        });
        return parts.join(" | ");
      }

      function gotoPage(delta) {
        if (pages.length < 2) return;
        var i = pages.findIndex(function(pg) { return pg.id === curPageId(); });
        var next = pages[(i + delta + pages.length) % pages.length];
        setCurPage(next.id);
        setSelectedConn(null); setMultiSelectConn([]); setFocusedPort(null);
        showToast("Pagina: " + next.name);
      }

      function addPage() {
        var name = window.prompt("Nombre de la nueva pagina de cables:", "Pagina " + (pages.length + 1));
        if (name === null) return;
        histBreak();
        var pg = { id: "pg-" + Date.now(), name: name.trim() || "Pagina " + (pages.length + 1) };
        setPages(function(ps) { return ps.concat([pg]); });
        setCurPage(pg.id);
        showToast("Pagina creada: " + pg.name);
      }

      function renamePage() {
        var id = curPageId();
        var pg = pages.find(function(x) { return x.id === id; });
        var name = window.prompt("Renombrar pagina:", pg.name);
        if (name === null || !name.trim()) return;
        histBreak();
        setPages(function(ps) { return ps.map(function(x) { return x.id === id ? Object.assign({}, x, { name: name.trim() }) : x; }); });
      }

      function deletePage() {
        if (pages.length < 2) { showToast("Debe quedar al menos una pagina"); return; }
        var id = curPageId();
        var n = connections.filter(function(c) { return (c.page || pages[0].id) === id; }).length;
        var pg = pages.find(function(x) { return x.id === id; });
        if (!window.confirm("Borrar la pagina \"" + pg.name + "\" y sus " + n + " cables?")) return;
        histBreak();
        var rest = pages.filter(function(x) { return x.id !== id; });
        // Los cables sin pagina explicita pertenecen a la primera; al borrarla se van con ella
        setConnections(function(cs) {
          return cs.filter(function(c) { return (c.page || pages[0].id) !== id; });
        });
        setPages(rest);
        setCurPage(rest[0].id);
      }

      // ── Paginas por modulo ──
      function addModPage(devId) {
        var dev = devById[devId];
        if (!dev) return;
        var count = dev.pages && dev.pages.length ? dev.pages.length : 1;
        var name = window.prompt("Nombre de la nueva pagina de " + dev.name + ":", "Pagina " + (count + 1));
        if (name === null) return;
        histBreak();
        var ts = Date.now();
        var pg = { id: "mp-" + ts, name: name.trim() || "Pagina " + (count + 1) };
        setDevices(function(ds) { return ds.map(function(d) {
          if (d.id !== devId) return d;
          var base = d.pages && d.pages.length ? d.pages : [{ id: "mp1", name: "Pagina 1" }];
          return Object.assign({}, d, { pages: base.concat([pg]) });
        }); });
        setModPage(function(m) { var n = Object.assign({}, m); n[devId] = pg.id; return n; });
        showToast(dev.name + ": " + pg.name);
      }

      function gotoModPage(devId, delta) {
        var dev = devById[devId];
        if (!dev || !dev.pages || dev.pages.length < 2) return false;
        var cur = curModPage(dev);
        var i = dev.pages.findIndex(function(pg) { return pg.id === cur; });
        var next = dev.pages[(i + delta + dev.pages.length) % dev.pages.length];
        setModPage(function(m) { var n = Object.assign({}, m); n[devId] = next.id; return n; });
        setSelectedConn(null); setMultiSelectConn([]);
        return true;
      }

      function renameModPage(devId) {
        var dev = devById[devId];
        var id = curModPage(dev);
        var pg = dev.pages.find(function(x) { return x.id === id; });
        var name = window.prompt("Renombrar pagina de " + dev.name + ":", pg.name);
        if (name === null || !name.trim()) return;
        histBreak();
        setDevices(function(ds) { return ds.map(function(d) {
          return d.id !== devId ? d : Object.assign({}, d, { pages: d.pages.map(function(x) {
            return x.id === id ? Object.assign({}, x, { name: name.trim() }) : x;
          }) });
        }); });
      }

      function deleteModPage(devId) {
        var dev = devById[devId];
        if (!dev || !dev.pages || dev.pages.length < 2) return;
        var id = curModPage(dev);
        var pg = dev.pages.find(function(x) { return x.id === id; });
        var mine = function(c) { return (c.from.device === devId || c.to.device === devId) && connPageOf(c, dev) === id; };
        var n = connections.filter(mine).length;
        if (!window.confirm("Borrar la pagina \"" + pg.name + "\" de " + dev.name + " y sus " + n + " cables?")) return;
        histBreak();
        var rest = dev.pages.filter(function(x) { return x.id !== id; });
        setConnections(function(cs) {
          return cs.filter(function(c) { return !mine(c); }).map(function(c) {
            // cables que dependian de la pagina por defecto borrada quedan fijados a la nueva primera
            if ((c.from.device === devId || c.to.device === devId) && !(c.mpage && c.mpage[devId]) && id === dev.pages[0].id) {
              var mp = Object.assign({}, c.mpage || {}); mp[devId] = rest[0].id;
              return Object.assign({}, c, { mpage: mp });
            }
            return c;
          });
        });
        setDevices(function(ds) { return ds.map(function(d) {
          return d.id !== devId ? d : Object.assign({}, d, { pages: rest });
        }); });
        setModPage(function(m) { var nm = Object.assign({}, m); nm[devId] = rest[0].id; return nm; });
      }

      function setConnMode(ids, mode) {
        setConnections(function(cs) {
          return cs.map(function(c) { return ids.indexOf(c.id) >= 0 ? Object.assign({}, c, { mode: mode }) : c; });
        });
      }

      function ctxItems(m) {
        var items = [];
        if (m.kind === "dev") {
          var multi = multiSelect.length > 1 && multiSelect.indexOf(m.id) >= 0;
          var ids = multi ? multiSelect : [m.id];
          var nConn = pageConns.filter(function(c) {
            return ids.indexOf(c.from.device) >= 0 || ids.indexOf(c.to.device) >= 0;
          }).length;
          if (!multi) {
            var dev = devices.find(function(d) { return d.id === m.id; });
            if (!dev) return [];
            items.push({ header: dev.name });
            items.push({ label: "Editar puertos...", icon: "⚙", run: function() { setEditingPorts(m.id); } });
            items.push({ label: "Nota...", icon: "✎", run: function() { setEditingDeviceNote(m.id); } });
            items.push({ label: "Duplicar", icon: "⧉", hint: "Ctrl+D", run: duplicateSelection });
            items.push({ label: "Guardar como plantilla", icon: "★", run: function() { saveTemplate(dev); } });
            items.push({ label: "Seleccionar conectados", icon: "⇆", disabled: nConn === 0, run: function() {
              var set = [m.id];
              pageConns.forEach(function(c) {
                if (c.from.device === m.id && set.indexOf(c.to.device) < 0) set.push(c.to.device);
                if (c.to.device === m.id && set.indexOf(c.from.device) < 0) set.push(c.from.device);
              });
              setMultiSelect(set); setSelected(null);
            } });
          } else {
            items.push({ header: ids.length + " dispositivos" });
            items.push({ label: "Duplicar seleccion", icon: "⧉", hint: "Ctrl+D", run: duplicateSelection });
          }
          items.push({ label: "Desconectar todo (" + nConn + ")", icon: "✂", disabled: nConn === 0, run: function() { disconnectDevices(ids); } });
          items.push({ label: multi ? "Exportar CSV (" + ids.length + " modulos)" : "Exportar CSV del modulo", icon: "⇩",
            run: function() { exportModuleCSV(ids); } });
          if (!multi) {
            items.push({ sep: true });
            items.push({ header: "Paginas del modulo" });
            items.push({ label: "Nueva pagina de cables", icon: "+", run: function() { addModPage(m.id); } });
            if (dev.pages && dev.pages.length > 1) {
              items.push({ label: "Pagina anterior / siguiente", icon: "⇆", hint: "← →", run: function() { gotoModPage(m.id, 1); } });
              items.push({ label: "Renombrar pagina actual", icon: "✎", run: function() { renameModPage(m.id); } });
              items.push({ label: "Borrar pagina actual", icon: "×", danger: true, run: function() { deleteModPage(m.id); } });
            }
          }
          items.push({ sep: true });
          items.push({ label: multi ? "Borrar " + ids.length + " dispositivos" : "Borrar dispositivo", icon: "×", danger: true,
            run: function() { if (multi) deleteMultiple(); else deleteDevice(m.id); } });
        } else if (m.kind === "conn") {
          var multiC = multiSelectConn.length > 1 && multiSelectConn.indexOf(m.id) >= 0;
          var cids = multiC ? multiSelectConn : [m.id];
          var conn = connections.find(function(c) { return c.id === m.id; });
          if (!conn) return items;
          if (!multiC) {
            var fd = devices.find(function(d) { return d.id === conn.from.device; });
            var td = devices.find(function(d) { return d.id === conn.to.device; });
            items.push({ header: (fd ? fd.name : "?") + " → " + (td ? td.name : "?") });
            items.push({ label: "Editar cable...", icon: "✎", run: function() { setSelectedConn(m.id); } });
            items.push({ label: "Seleccionar extremos", icon: "⇆", run: function() {
              setMultiSelect([conn.from.device, conn.to.device]); setSelected(null); setSelectedConn(null);
            } });
          } else {
            items.push({ header: cids.length + " cables" });
          }
          items.push({ sep: true });
          [["all", "Ambos"], ["daw", "Solo DAW"], ["jam", "Solo Jam"]].forEach(function(mo) {
            var active = !multiC && (conn.mode || "all") === mo[0];
            items.push({ label: "Modo: " + mo[1], icon: active ? "✓" : "", run: function() { setConnMode(cids, mo[0]); } });
          });
          items.push({ sep: true });
          items.push({ label: multiC ? "Borrar " + cids.length + " cables" : "Borrar cable", icon: "×", danger: true,
            run: function() { if (multiC) deleteMultipleConnections(); else deleteConnection(m.id); } });
        } else if (m.kind === "port") {
          var pdev = devices.find(function(d) { return d.id === m.id.devId; });
          var pport = pdev && pdev.ports.find(function(pp) { return pp.id === m.id.portId; });
          if (!pport) return items;
          var portConns = pageConns.filter(function(c) {
            return (c.from.device === pdev.id && c.from.port === pport.id) || (c.to.device === pdev.id && c.to.port === pport.id);
          });
          items.push({ header: pdev.name + " / " + pport.name });
          items.push({ label: "Renombrar puerto", icon: "✎", hint: "Doble click", run: function() {
            startRenamePort(pdev.id, pport.id, m.sx, m.sy);
          } });
          items.push({ label: "Resaltar conexiones", icon: "◉", disabled: portConns.length === 0, run: function() {
            setFocusedPort({ devId: pdev.id, portId: pport.id });
          } });
          items.push({ label: "Desconectar puerto (" + portConns.length + ")", icon: "✂", disabled: portConns.length === 0, run: function() {
            var cids = portConns.map(function(c) { return c.id; });
            setConnections(function(cs) { return cs.filter(function(c) { return cids.indexOf(c.id) < 0; }); });
          } });
          items.push({ sep: true });
          items.push({ label: "Borrar puerto", icon: "×", danger: true, run: function() {
            var did = pdev.id, pid = pport.id;
            setConnections(function(cs) {
              return cs.filter(function(c) { return !((c.from.device === did && c.from.port === pid) || (c.to.device === did && c.to.port === pid)); });
            });
            setDevices(function(ds) { return ds.map(function(d) {
              return d.id === did ? Object.assign({}, d, { ports: d.ports.filter(function(pp) { return pp.id !== pid; }) }) : d;
            }); });
          } });
        } else if (m.kind === "note") {
          items.push({ header: "Nota" });
          items.push({ label: "Borrar nota", icon: "×", danger: true, run: function() { deleteStickyNote(m.id); } });
        } else {
          items.push({ label: "Dispositivo aqui", icon: "+", run: function() { setAddPos(m.world); setShowAdd(true); } });
          items.push({ label: "Nota aqui", icon: "+", run: function() { addStickyNote(m.world); } });
          items.push({ sep: true });
          items.push({ header: "Pagina: " + (pages.find(function(x) { return x.id === curPageId(); }) || {}).name });
          items.push({ label: "Nueva pagina de cables", icon: "+", run: addPage });
          items.push({ label: "Renombrar pagina", icon: "✎", run: renamePage });
          items.push({ label: "Borrar pagina", icon: "×", danger: true, disabled: pages.length < 2, run: deletePage });
          items.push({ sep: true });
          items.push({ label: "Seleccionar todo", icon: "▢", hint: "Ctrl+A", run: selectAll });
          items.push({ label: "Encuadrar vista", icon: "⤢", run: function() { fitToView(); } });
          items.push({ label: theme === "dark" ? "Tema claro" : "Tema oscuro", icon: theme === "dark" ? "☀" : "☾", run: toggleTheme });
          items.push({ label: "Deshacer", icon: "↶", hint: "Ctrl+Z", disabled: hist.current.past.length === 0, run: undo });
          items.push({ label: "Rehacer", icon: "↷", hint: "Ctrl+Shift+Z", disabled: hist.current.future.length === 0, run: redo });
          items.push({ sep: true });
          items.push({ header: "Layout" });
          items.push({ label: "Grid", icon: "⊞", run: layoutGrid });
          items.push({ label: "Por tipo", icon: "⊟", run: layoutByType });
          items.push({ label: "Flujo de senal", icon: "→", run: layoutSignalFlow });
          items.push({ label: "Circular", icon: "◎", run: layoutCircular });
        }
        return items;
      }

      function renderCtxMenu() {
        if (!ctxMenu) return null;
        var items = ctxItems(ctxMenu);
        if (items.length === 0) return null;
        var W = 220;
        var estH = items.reduce(function(a, it) { return a + (it.sep ? 9 : it.header ? 24 : 28); }, 12);
        var left = Math.min(ctxMenu.sx, window.innerWidth - W - 8);
        var top = Math.min(ctxMenu.sy, window.innerHeight - estH - 8);
        return (
          <div ref={ctxMenuRef} role="menu"
            onContextMenu={function(e) { e.preventDefault(); }}
            style={{ position: "fixed", left: Math.max(8, left), top: Math.max(8, top), width: W, zIndex: 200,
              background: "rgba(var(--panel),0.98)", border: "1px solid rgba(var(--fg),0.12)", borderRadius: 8,
              padding: 6, boxShadow: "0 10px 30px rgba(var(--shade),calc(0.5 * var(--shade-k)))", backdropFilter: "blur(12px)" }}>
            {items.map(function(it, i) {
              if (it.sep) return <div key={i} style={{ height: 1, background: "rgba(var(--fg),0.07)", margin: "4px 2px" }} />;
              if (it.header) return (
                <div key={i} style={{ padding: "5px 8px 3px", color: "rgba(var(--fg),0.35)", fontSize: 9, letterSpacing: 1,
                  textTransform: "uppercase", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.header}</div>
              );
              return (
                <button key={i} disabled={it.disabled} role="menuitem"
                  onClick={function() { setCtxMenu(null); histBreak(); it.run(); }}
                  onMouseEnter={function(e) { if (!it.disabled) e.currentTarget.style.background = it.danger ? "rgba(255,80,80,0.12)" : "rgba(var(--fg),0.07)"; }}
                  onMouseLeave={function(e) { e.currentTarget.style.background = "transparent"; }}
                  style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "6px 8px",
                    background: "transparent", border: "none", borderRadius: 5, textAlign: "left",
                    color: it.disabled ? "rgba(var(--fg),0.2)" : it.danger ? "var(--danger-ink)" : "rgba(var(--fg),0.85)",
                    fontSize: 11, fontFamily: "inherit", cursor: it.disabled ? "default" : "pointer" }}>
                  <span style={{ width: 14, textAlign: "center", opacity: 0.8 }}>{it.icon}</span>
                  <span style={{ flex: 1 }}>{it.label}</span>
                  {it.hint ? <span style={{ color: "rgba(var(--fg),0.5)", fontSize: 9 }}>{it.hint}</span> : null}
                </button>
              );
            })}
          </div>
        );
      }

      // ── Puerto de un nodo: entrada a la izquierda, salida a la derecha, I/O en fila propia con ambos lados ──
      function renderPort(dev, port, row, rows) {
        var py = portRowY(dev, row, rows);
        var isOut = port.dir === "out";
        var isBoth = port.dir === "both";
        var kc = KIND_COLORS[port.kind] || KIND_COLORS.audio;
        var isFocused = focusedPort && focusedPort.devId === dev.id && focusedPort.portId === port.id;
        var dotFill = isFocused ? "rgb(var(--fg))" : kc.line;
        var dotStroke = "rgba(var(--shade),calc(0.5 * var(--shade-k)))";
        return (
          <g key={port.id}
            onContextMenu={function(e) { openCtx(e, "port", { devId: dev.id, portId: port.id }); }}
            onDoubleClick={function(e) {
              e.stopPropagation();
              setConnecting(null);
              startRenamePort(dev.id, port.id, e.clientX, e.clientY);
            }}
            onClick={function(e) {
              if (e.shiftKey) {
                e.stopPropagation();
                setFocusedPort(isFocused ? null : { devId: dev.id, portId: port.id });
                return;
              }
              startConnect(dev.id, port.id, e);
            }}
            onMouseEnter={function(e) {
              var rect = svgRef.current.getBoundingClientRect();
              setHoveredPort({ devId: dev.id, portId: port.id, sx: e.clientX - rect.left, sy: e.clientY - rect.top });
            }}
            onMouseLeave={function() { setHoveredPort(null); }}
            style={{ cursor: "pointer" }}>
            {isBoth ? (
              <g>
                <rect x={dev.x + 8} y={py + 2} width={NODE_W - 16} height={PORT_H - 4} rx={4} fill="rgba(var(--fg),0.04)" />
                {(function() {
                  // Solo se dibuja el lado que usan sus cables; sin cables, un punto a la derecha
                  var used = usedSide[dev.id + "|" + port.id] || { r: true };
                  return [used.l ? <circle key="l" cx={dev.x} cy={py + PORT_H / 2} r={5} fill={dotFill} stroke={dotStroke} strokeWidth={1.5} /> : null,
                    used.r ? <circle key="r" cx={dev.x + NODE_W} cy={py + PORT_H / 2} r={5} fill={dotFill} stroke={dotStroke} strokeWidth={1.5} /> : null];
                })()}
                <text x={dev.x + NODE_W / 2} y={py + PORT_H / 2 + 3.5} fill="rgba(var(--fg),0.65)" fontSize={9}
                  fontFamily="inherit" textAnchor="middle">⇄ {port.name}</text>
              </g>
            ) : (
              <g>
                <circle cx={isOut ? dev.x + NODE_W : dev.x} cy={py + PORT_H / 2} r={5} fill={dotFill} stroke={dotStroke} strokeWidth={1.5} />
                <text x={isOut ? dev.x + NODE_W - 12 : dev.x + 12} y={py + PORT_H / 2 + 3.5}
                  fill="rgba(var(--fg),0.65)" fontSize={9} fontFamily="inherit" textAnchor={isOut ? "end" : "start"}>{port.name}</text>
              </g>
            )}
          </g>
        );
      }

      // ── Renombrar puerto individual ──
      function startRenamePort(devId, portId, sx, sy) {
        var dev = devices.find(function(d) { return d.id === devId; });
        var port = dev && dev.ports.find(function(p) { return p.id === portId; });
        if (!port) return;
        setCtxMenu(null);
        renameCancelled.current = false;
        setRenamingPort({ devId: devId, portId: portId, sx: sx, sy: sy, value: port.name });
      }

      function commitRenamePort() {
        var r = renamingPort;
        if (!r || renameCancelled.current) return;
        renameCancelled.current = true; // Enter + blur no confirman dos veces
        setRenamingPort(null);
        histBreak();
        var name = r.value.trim();
        if (!name) return;
        setDevices(function(ds) { return ds.map(function(d) {
          if (d.id !== r.devId) return d;
          var changed = false;
          var np = d.ports.map(function(p) {
            if (p.id !== r.portId || p.name === name) return p;
            changed = true;
            return Object.assign({}, p, { name: name });
          });
          return changed ? Object.assign({}, d, { ports: np }) : d;
        }); });
      }

      function renderRenamePort() {
        if (!renamingPort) return null;
        var left = Math.max(8, Math.min(renamingPort.sx, window.innerWidth - 230));
        var top = Math.max(8, Math.min(renamingPort.sy, window.innerHeight - 50));
        return (
          <div onPointerDown={function(e) { e.stopPropagation(); }}
            style={{ position: "fixed", left: left, top: top, zIndex: 210, display: "flex", gap: 5,
              background: "rgba(var(--panel),0.98)", border: "1px solid rgba(0,206,201,0.4)", borderRadius: 6,
              padding: 5, boxShadow: "0 8px 24px rgba(var(--shade),calc(0.5 * var(--shade-k)))" }}>
            <input autoFocus value={renamingPort.value}
              onFocus={function(e) { e.target.select(); }}
              onChange={function(e) { var v = e.target.value; setRenamingPort(function(r) { return r ? Object.assign({}, r, { value: v }) : r; }); }}
              onKeyDown={function(e) {
                if (e.key === "Enter") commitRenamePort();
                else if (e.key === "Escape") { renameCancelled.current = true; setRenamingPort(null); }
              }}
              onBlur={commitRenamePort}
              style={Object.assign({}, inputSt, { width: 170 })} />
            <button onMouseDown={function(e) { e.preventDefault(); }} onClick={commitRenamePort}
              style={btnStyle("rgba(0,206,201,0.15)", "rgba(0,206,201,0.4)", "var(--teal-ink)")}>OK</button>
          </div>
        );
      }

      // ── CSV por modulo: una fila por puerto/conexion ──
      function exportModuleCSV(ids) {
        var rows = [["Dispositivo", "Puerto", "Direccion", "Senal", "Sentido", "Conectado a", "Puerto remoto", "Modo", "Canal MIDI out", "Canal MIDI in", "MPE", "ADAT", "Etiqueta", "Pagina"]];
        ids.forEach(function(did) {
          var d = devById[did];
          if (!d) return;
          d.ports.forEach(function(p) {
            var cs = connections.filter(function(c) {
              return (c.from.device === d.id && c.from.port === p.id) || (c.to.device === d.id && c.to.port === p.id);
            });
            var base = [d.name, p.name, DIR_LABEL[p.dir] || p.dir, kindLabel(p.kind)];
            if (cs.length === 0) { rows.push(base.concat(["", "", "", "", "", "", "", "", "", ""])); return; }
            cs.forEach(function(c) {
              var isFrom = c.from.device === d.id && c.from.port === p.id;
              var other = isFrom ? c.to : c.from;
              var od = devById[other.device];
              var op = od && od.ports.find(function(pp) { return pp.id === other.port; });
              rows.push(base.concat([
                isFrom ? "→" : "←", od ? od.name : "?", op ? op.name : "?",
                MODE_LABEL[c.mode || "all"] || c.mode,
                c.kind === "midi" ? chStr(c.midiChannelOut) : "",
                c.kind === "midi" ? chStr(c.midiChannelIn) : "",
                mpeStr(c),
                adatStr(c),
                c.label || "",
                pageLabel(c),
              ]));
            });
          });
        });
        var date = new Date().toISOString().slice(0, 10);
        var slug = ids.length === 1 && devById[ids[0]]
          ? devById[ids[0]].name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "modulo"
          : ids.length + "-modulos";
        downloadText("studio-router-" + slug + "-" + date + ".csv", toCSV(rows));
        showToast("CSV: " + (rows.length - 1) + " filas");
      }

      function exportCSV() {
        if (!devices || devices.length === 0) { showToast("No hay dispositivos"); return; }
        function portName(devId, portId) {
          var d = devById[devId];
          var p = d && d.ports.find(function(pp) { return pp.id === portId; });
          return p ? p.name : "?";
        }

        var patch = [["Origen", "Puerto origen", "Destino", "Puerto destino", "Tipo", "Modo", "Canal MIDI out", "Canal MIDI in", "MPE", "ADAT", "Etiqueta", "Pagina"]];
        connections.forEach(function(c) {
          var fd = devById[c.from.device], td = devById[c.to.device];
          patch.push([
            fd ? fd.name : "?", portName(c.from.device, c.from.port),
            td ? td.name : "?", portName(c.to.device, c.to.port),
            kindLabel(c.kind), MODE_LABEL[c.mode || "all"] || c.mode,
            c.kind === "midi" ? chStr(c.midiChannelOut) : "",
            c.kind === "midi" ? chStr(c.midiChannelIn) : "",
            mpeStr(c),
            adatStr(c),
            c.label || "",
            pageLabel(c),
          ]);
        });

        var inv = [["Dispositivo", "Tipo", "Puerto", "Direccion", "Senal", "Conexiones", "Notas"]];
        devices.forEach(function(d) {
          d.ports.forEach(function(p) {
            var n = connections.filter(function(c) {
              return (c.from.device === d.id && c.from.port === p.id) || (c.to.device === d.id && c.to.port === p.id);
            }).length;
            inv.push([d.name, d.type, p.name, DIR_LABEL[p.dir] || p.dir, kindLabel(p.kind), n, d.notes || ""]);
          });
        });

        var date = new Date().toISOString().slice(0, 10);
        downloadText("studio-router-patchlist-" + date + ".csv", toCSV(patch));
        // Pequeno retraso: algunos navegadores bloquean dos descargas simultaneas
        setTimeout(function() { downloadText("studio-router-inventario-" + date + ".csv", toCSV(inv)); }, 400);
        showToast("CSV: " + connections.length + " cables, " + (inv.length - 1) + " puertos");
      }

      // Genera N puertos con numeracion consecutiva (continua si ya existen con ese prefijo)
      function makeBulkPorts(existing) {
        var n = Math.max(1, Math.min(64, parseInt(bulk.n, 10) || 1));
        var prefix = (bulk.prefix || "").trim() || defaultPortPrefix(bulk.kind, bulk.dir);
        var start = 0;
        existing.forEach(function(p) {
          if (p.name.indexOf(prefix + " ") === 0) {
            var num = parseInt(p.name.slice(prefix.length + 1), 10);
            if (num > start) start = num;
          }
        });
        return Array.from({ length: n }, function(_, i) {
          return { name: prefix + " " + (start + i + 1), dir: bulk.dir, kind: bulk.kind };
        });
      }

      function renderBulkRow(onAdd) {
        return (
          <div style={{ display: "flex", gap: 5, marginBottom: 8, alignItems: "center" }}>
            <input type="number" min="1" max="64" value={bulk.n} title="Cantidad de puertos"
              onChange={function(e) { var v = e.target.value; setBulk(function(b) { return Object.assign({}, b, { n: v }); }); }}
              style={Object.assign({}, inputSt, { width: 52 })} />
            <input placeholder={defaultPortPrefix(bulk.kind, bulk.dir)} value={bulk.prefix} title="Prefijo del nombre"
              onChange={function(e) { var v = e.target.value; setBulk(function(b) { return Object.assign({}, b, { prefix: v }); }); }}
              style={Object.assign({}, inputSt, { flex: 1, minWidth: 0 })} />
            <select value={bulk.dir}
              onChange={function(e) { var v = e.target.value; setBulk(function(b) { return Object.assign({}, b, { dir: v }); }); }}
              style={selectSt}>
              <option value="in">In</option><option value="out">Out</option><option value="both">I/O ⇄ (USB)</option>
            </select>
            <select value={bulk.kind}
              onChange={function(e) { var v = e.target.value; setBulk(function(b) { return Object.assign({}, b, { kind: v }); }); }}
              style={selectSt}>
              <option value="audio">Audio</option><option value="midi">MIDI</option>
              <option value="cv">CV</option><option value="digital">Digital</option><option value="adat">ADAT</option>
            </select>
            <button onClick={onAdd}
              style={{ padding: "5px 10px", background: "rgba(0,206,201,0.12)", border: "1px solid rgba(0,206,201,0.4)",
                borderRadius: 4, color: "var(--teal-ink)", fontSize: 11, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>
              + {Math.max(1, Math.min(64, parseInt(bulk.n, 10) || 1))}
            </button>
          </div>
        );
      }

      // ── Plantillas de dispositivo ──
      // Incluidas: los equipos del estudio por defecto. Del usuario: guardadas en localStorage aparte.
      var BUILTIN_TEMPLATES = DEFAULT_DEVICES.map(function(d) {
        return { id: "builtin:" + d.id, name: d.name, type: d.type, color: d.color,
          ports: d.ports.map(function(p) { return { name: p.name, dir: p.dir, kind: p.kind }; }), builtin: true };
      });

      function persistTemplates(list) {
        setTemplates(list);
        try { localStorage.setItem("studio-router-templates", JSON.stringify(list)); } catch(e) {}
      }

      function findTemplate(id) {
        return templates.find(function(t) { return t.id === id; }) || BUILTIN_TEMPLATES.find(function(t) { return t.id === id; });
      }

      // Guarda una plantilla; si ya existe una del usuario con ese nombre, pregunta si reemplazarla
      function saveTemplate(src) {
        var name = window.prompt("Nombre de la plantilla:", src.name || "Mi equipo");
        if (name === null || !name.trim()) return;
        name = name.trim();
        var tpl = { id: "tpl-" + Date.now(), name: name, type: src.type, typeIcon: typeIcon(src.type), color: src.color,
          ports: src.ports.map(function(p) { return { name: p.name, dir: p.dir, kind: p.kind }; }),
          pages: (src.pages || []).map(function(pg) { return typeof pg === "string" ? pg : pg.name; }) };
        if (tpl.pages.length < 2) delete tpl.pages;
        var same = templates.find(function(t) { return t.name.toLowerCase() === name.toLowerCase(); });
        if (same) {
          if (!window.confirm("Ya existe la plantilla \"" + same.name + "\". Reemplazarla?")) return;
          tpl.id = same.id;
          persistTemplates(templates.map(function(t) { return t.id === same.id ? tpl : t; }));
        } else {
          persistTemplates(templates.concat([tpl]));
        }
        showToast("Plantilla guardada: " + name + " (" + tpl.ports.length + " puertos" + (tpl.pages ? ", " + tpl.pages.length + " paginas" : "") + ")");
      }

      function deleteTemplate(id) {
        var t = templates.find(function(x) { return x.id === id; });
        if (!t || !window.confirm("Borrar la plantilla \"" + t.name + "\"?")) return;
        persistTemplates(templates.filter(function(x) { return x.id !== id; }));
        setTplPick("");
        showToast("Plantilla borrada: " + t.name);
      }

      // Rellena el formulario de "Nuevo dispositivo" con una plantilla
      function applyTemplate(id) {
        setTplPick(id);
        if (!id) { setNewDevice({ name: "", type: "synth", color: "#00B894" }); setNewPorts([]); setNewPages([]); return; }
        var t = findTemplate(id);
        if (!t) return;
        // Si la plantilla usa una categoria propia que ya no existe, se recrea con su icono
        if (isCustomType(t.type) && !customTypes.some(function(c) { return c.name === t.type; })) {
          setCustomTypes(function(cs) { return cs.concat([{ name: t.type, icon: t.typeIcon || "●" }]); });
        }
        setNewDevice({ name: t.name, type: t.type, color: t.color });
        setNewPorts(t.ports.map(function(p) { return { name: p.name, dir: p.dir, kind: p.kind }; }));
        setNewPages(Array.isArray(t.pages) ? t.pages.slice() : []);
      }

      function addDevice() {
        if (!newDevice.name.trim()) return;

        var id = "dev-" + Date.now();
        var center = addPos || screenToWorld(400, 300);
        setDevices(function(ds) {

            ports: newPorts.map(function(p, i) { return { id: id + "-p" + i, name: p.name, dir: p.dir, kind: p.kind }; }),
            pages: newPages.length > 1 ? newPages.map(function(n, i) { return { id: i === 0 ? "mp1" : "mp" + (i + 1), name: n }; }) : undefined,
          }]);
        });
        setNewDevice({ name: "", type: "synth", color: "#00B894" });
        setNewPorts([]);
        setNewPages([]);
        setTplPick("");

        setAddPos(null);

      function addStickyNote(pos) {

      function deleteStickyNote(id) {

      function saveSnapshot(name) {

      function deleteSnapshot(id) {

      function exportJSON() {
        if (!devices || devices.length === 0) { showToast("No hay dispositivos"); return; }
        var data = JSON.stringify({ version: 3, devices: devices, connections: connections, stickyNotes: stickyNotes, pages: pages, customTypes: customTypes }, null, 2);
        setExportData(data);

      }

      function copyToClipboard() {
        try { navigator.clipboard.writeText(exportData); showToast("JSON copiado"); }
        catch(e) { showToast("Selecciona el texto manualmente"); }
      }

      function importFromText() {

          var d = normalizeData(JSON.parse(importText));
          if (d.devices.length > 0) {
            histBreak();

      // Reset: "empty" deja el lienzo vacio; "example" carga el estudio de ejemplo.
      // Categorias propias y plantillas se conservan. Se puede deshacer con Ctrl+Z.
      function resetStudio(mode) {
        setShowReset(false);
        histBreak();
        stopAnimation();
        setDevices(mode === "example" ? DEFAULT_DEVICES : []);
        setConnections([]);
        setStickyNotes([]);
        setPages(DEFAULT_PAGES);
        setCurPage("p1");
        setModPage({});
        setMultiSelect([]);
        setMultiSelectConn([]);
        setSelected(null);
        setSelectedConn(null);
        setPan({ x: 60, y: 60 });
        setZoom(mode === "example" ? 0.45 : 1);
        showToast(mode === "example" ? "Estudio de ejemplo cargado (Ctrl+Z para deshacer)" : "Lienzo vacio (Ctrl+Z para deshacer)");
      }

      function animateTo(targetPositions) {
        stopAnimation();
        histBreak();
        var startPositions = {};
        devices.forEach(function(d) { startPositions[d.id] = { x: d.x, y: d.y }; });
        var start = null;
        var duration = 600;
        function step(ts) {
          if (!start) start = ts;
          var progress = Math.min((ts - start) / duration, 1);
          var ease = 1 - Math.pow(1 - progress, 3);
          setDevices(function(ds) {
            return ds.map(function(d) {
              var from = startPositions[d.id] || { x: d.x, y: d.y };
              var to = targetPositions[d.id] || { x: d.x, y: d.y };
              return Object.assign({}, d, {
                x: from.x + (to.x - from.x) * ease,
                y: from.y + (to.y - from.y) * ease,
              });
            });
          });
          if (progress < 1) {
            animRef.current = requestAnimationFrame(step);
          } else {
            animRef.current = null;
          }
        }
        animRef.current = requestAnimationFrame(step);
        // Encuadra hacia las posiciones destino, no las del render actual (1)
        fitTimerRef.current = setTimeout(function() { fitTimerRef.current = null; fitToView(targetPositions); }, 650);
      }

      function calcNodeH(dev) {
        return nodeHeight(dev, filter);
      }

      // Con filtro de direccion un nodo puede quedar solo con encabezado (sus cables llegan al encabezado)
      function isDevVisible(dev) {
        return viewIsFull(filter) || dev.ports.some(function(p) { return kindOk(p, filter); });
      }

      function layoutGrid() {
        var cols = Math.ceil(Math.sqrt(devices.length));
        var gapX = 40, gapY = 40;
        var startX = 60, startY = 80;
        // Calculate max height per row
        var rowHeights = [];
        devices.forEach(function(d, i) {
          var row = Math.floor(i / cols);
          var h = calcNodeH(d);
          rowHeights[row] = Math.max(rowHeights[row] || 0, h);
        });
        var positions = {};
        devices.forEach(function(d, i) {
          var col = i % cols;
          var row = Math.floor(i / cols);
          var cx = startX + col * (NODE_W + gapX);
          var cy = startY;
          for (var r = 0; r < row; r++) {
            cy += (rowHeights[r] || 200) + gapY;
          }
          positions[d.id] = { x: cx, y: cy };
        });
        animateTo(positions);
      }

      function layoutByType() {
        var typeGroups = {
          sequencer: [], "midi-router": [], "midi-hub": [], controller: [],
          synth: [], "drum-machine": [], sampler: [], modular: [],
          mixer: [], effect: [], patchbay: [],
          interface: [], preamp: [], converter: [], clock: [],
          monitor: [], mic: [], tablet: [],
        };
        customTypes.forEach(function(c) { if (!typeGroups[c.name]) typeGroups[c.name] = []; });
        devices.forEach(function(d) {
          var key = d.type || "synth";
          if (!typeGroups[key]) typeGroups[key] = [];
          typeGroups[key].push(d);
        });
        var positions = {};
        var colX = 60;
        var gapX = 40, gapY = 30;
        Object.keys(typeGroups).forEach(function(type) {
          var group = typeGroups[type];
          if (group.length === 0) return;
          var y = 80;
          group.forEach(function(d) {
            positions[d.id] = { x: colX, y: y };
            y += calcNodeH(d) + gapY;
          });
          colX += NODE_W + gapX;
        });
        animateTo(positions);
      }

      function layoutSignalFlow() {
        var columns = {
          sources:    ["hapax", "octatrack", "rytm", "hydra", "pro2", "td3", "subphatty", "ipad", "sv100", "fcone", "twister"],
          controllers: ["mrcc", "rk004", "misslink", "usamo", "metamod", "mutbrain"],
          processing: ["h9", "heat", "rat", "optxv2"],
          routing:    ["spatch", "fx16ii"],
          capture:    ["motu", "octopre"],
          output:     ["mondesk", "monjam", "sub", "pc", "modular"],
        };
        var colKeys = Object.keys(columns);
        var positions = {};
        var colX = 60;
        var gapX = 40, gapY = 30;
        colKeys.forEach(function(col) {
          var ids = columns[col];
          var devInCol = devices.filter(function(d) { return ids.indexOf(d.id) >= 0; });
          if (col === "sources") {
            devices.forEach(function(d) {
              var found = false;
              colKeys.forEach(function(k) { if (columns[k].indexOf(d.id) >= 0) found = true; });
              if (!found) devInCol.push(d);
            });
          }
          if (devInCol.length === 0) return;
          var y = 80;
          devInCol.forEach(function(d) {
            positions[d.id] = { x: colX, y: y };
            y += calcNodeH(d) + gapY;
          });
          colX += NODE_W + gapX;
        });
        animateTo(positions);
      }

      function layoutCircular() {
        var radius = Math.max(500, devices.length * 55);
        var cx = radius + NODE_W;
        var cy = radius + 100;
        var positions = {};
        devices.forEach(function(d, i) {
          var angle = (i / devices.length) * 2 * Math.PI - Math.PI / 2;
          positions[d.id] = {
            x: cx + Math.cos(angle) * radius - NODE_W / 2,
            y: cy + Math.sin(angle) * radius - 60,
          };
        });
        animateTo(positions);
      }

      function saveUserLayout(name) {
        if (!name || !name.trim()) return;
        var positions = {};
        devices.forEach(function(d) { positions[d.id] = { x: d.x, y: d.y }; });
        var layout = {
          id: "ul-" + Date.now(),
          name: name.trim(),
          date: new Date().toISOString().slice(0, 19).replace("T", " "),
          positions: positions,
        };
        var updated = userLayouts.concat([layout]);
        setUserLayouts(updated);
        try { localStorage.setItem("studio-router-user-layouts", JSON.stringify(updated)); } catch(e) {}
        setNewLayoutName("");
        showToast("Layout guardado: " + layout.name);
      }

      function loadUserLayout(layout) {
        histBreak();
        var positions = layout.positions;
        // Only move devices that exist in both layout and current devices
        setDevices(function(ds) {
          return ds.map(function(d) {
            if (positions[d.id]) {
              return Object.assign({}, d, { x: positions[d.id].x, y: positions[d.id].y });
            }
            return d;
          });
        });
        fitToView(positions);
        showToast("Layout cargado: " + layout.name);
      }

      function deleteUserLayout(id) {
        var updated = userLayouts.filter(function(l) { return l.id !== id; });
        setUserLayouts(updated);
        try { localStorage.setItem("studio-router-user-layouts", JSON.stringify(updated)); } catch(e) {}
      }

      // posOverride opcional: {id: {x, y}} para encuadrar posiciones que aun no estan en el estado
      function fitToView(posOverride) {
        var visDevs = devices.filter(isDevVisible);
        if (visDevs.length === 0) return;
        var svgEl = svgRef.current;
        if (!svgEl) return;
        var vw = svgEl.clientWidth || window.innerWidth;
        var vh = svgEl.clientHeight || window.innerHeight;
        var pad = 60;
        // Calculate bounding box of visible devices
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        visDevs.forEach(function(d) {
          var h = calcNodeH(d);
          var pos = (posOverride && posOverride[d.id]) || d;
          minX = Math.min(minX, pos.x);
          minY = Math.min(minY, pos.y);
          maxX = Math.max(maxX, pos.x + NODE_W);
          maxY = Math.max(maxY, pos.y + h);
        });
        var contentW = maxX - minX;
        var contentH = maxY - minY;
        var scaleX = (vw - pad * 2) / contentW;
        var scaleY = (vh - pad * 2) / contentH;
        var newZoom = Math.min(scaleX, scaleY, 1.0);
        newZoom = Math.max(newZoom, 0.15);
        var newPanX = pad - minX * newZoom + ((vw - pad * 2) - contentW * newZoom) / 2;
        var newPanY = pad - minY * newZoom + ((vh - pad * 2) - contentH * newZoom) / 2;
        // Account for toolbar height
        newPanY += 22;
        setZoom(newZoom);
        setPan({ x: newPanX, y: newPanY });
      }

      // Posicion de cada puerto visible: "devId|portId" -> {x, y}. Un recorrido por render en vez de find() por cable.
      var portPos = useMemo(function() {
        var map = {};
        devices.forEach(function(dev) {
          if (!isDevVisible(dev)) return;
          var ports = visiblePorts(dev, filter);
          var rows = portRows(ports);
          var iIn = 0, iOut = 0, iBoth = 0;
          ports.forEach(function(p) {
            var row = p.dir === "both" ? rows.io + iBoth++ : p.dir === "out" ? iOut++ : iIn++;
            var y = portRowY(dev, row, rows) + PORT_H / 2;
            if (p.dir === "both") {
              map[dev.id + "|" + p.id] = { x: dev.x, xr: dev.x + NODE_W, cx: dev.x + NODE_W / 2, y: y, both: true, nx: -1, dir: "both" };
            } else {
              var isOut = p.dir === "out";
              map[dev.id + "|" + p.id] = { x: isOut ? dev.x + NODE_W : dev.x, y: y, nx: isOut ? 1 : -1, dir: p.dir };
            }
          });
          if (filter.dir) {
            dev.ports.forEach(function(p) {
              var key = dev.id + "|" + p.id;
              if (map[key] || !kindOk(p, filter)) return;
              var isOut = p.dir === "out";
              map[key] = { x: isOut ? dev.x + NODE_W : dev.x, y: dev.y + HEADER_H / 2, nx: isOut ? 1 : -1, dir: p.dir, anchor: true };
            });
          }
        });
        return map;
      }, [devices, filter]);

      var devById = useMemo(function() {
        var map = {};
        devices.forEach(function(d) { map[d.id] = d; });
        return map;
      }, [devices]);

      var pageConns = connections.filter(connPageOk);

      var filteredConns = pageConns.filter(function(c) {
        if (filter.kinds.length > 0 && filter.kinds.indexOf(c.kind) < 0) return false;
        if (modeFilter !== "all" && c.mode !== "all" && c.mode !== modeFilter) return false;
        // Ambos extremos deben estar visibles (evita cables hacia nodos/puertos ocultos)

              {/* Connections */}
